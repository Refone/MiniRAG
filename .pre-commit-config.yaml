repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      # 整理 import，并删除未使用的 import
      - id: ruff
        args: [--fix]

      # 格式化 Python 代码
      - id: ruff-format

  # 仓库自带的契约校验（规则内嵌在 tools/*.py，见 docs/architecture.md）
  - repo: local
    hooks:
      - id: check-layout
        name: check_layout (顶层目录契约)
        entry: .venv/bin/python tools/check_layout.py
        language: system
        pass_filenames: false

      - id: check-layers
        name: check_layers (分层依赖 / common tier)
        entry: .venv/bin/python tools/check_layers.py
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest (unit + contract)
        entry: .venv/bin/pytest -q
        language: system
        pass_filenames: false
