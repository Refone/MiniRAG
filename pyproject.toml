[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["backend"]
sources = ["backend"]

[project]
name = "mini-rag"
version = "0.1.0"
description = "MiniRag - Minimal RAG Demo"
readme = "README.md"
authors = [
    { name = "Refone Leo", email = "710196926@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chunkana>=0.1.6",
    "dashscope>=2.0.3",  # 2.x 懒加载 Assistants，避免 import 时弃用告警
    "fastapi>=0.141.1",
    "httpx2>=2.13.0",
    "langchain>=1.4.2",
    "langchain-core>=1.6.4",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=1.6.4",
    "langgraph>=1.2.12",
    "loguru>=0.7.3",
    "mcp>=2.2.0",
    "mcp-types>=2.2.0",
    "minio>=7.2.20",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymilvus>=3.0.2",
    "pymongo>=4.18.1",
    "pypdf>=6.0.0",
    "requests>=2.34.2",
    "rich>=13.0.0",
    "starlette>=1.10.0",  # TestClient 不再用 anyio.abc.BlockingPortal 弃用别名
    "tiktoken>=0.7.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "grandalf>=0.8",      # 仅 graph.get_graph().draw_ascii() 的 __main__ 调试需要
    "httpx>=0.28",
    "langchain-community<0.4",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ragas==0.4.3",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = [
    "E4",   # import 相关错误
    "E7",   # 语句错误
    "E9",   # 运行错误
    "F",    # Pyflakes：包括未使用的 import
    "I",    # isort：import 排序
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "--tb=short --strict-markers -m 'not integration and not live'"
markers = [
    "unit: 纯逻辑/假依赖，无网络无 key（默认）",
    "contract: API/SSE 契约，TestClient + 假存储，无网络无 key（默认）",
    "integration: 真 Mongo/MinIO/Milvus，假模型，需显式开启",
    "live: 真模型/真 key，手动运行，绝不进 CI",
]
