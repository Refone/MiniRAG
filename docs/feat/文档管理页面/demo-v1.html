<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档管理页面 · demo-v1（fake 数据）</title>
<!--
  ═══════════════════════════════════════════════════════════════════
  文档管理页面 · 交互原型 demo-v1（依据 v0评审意见.md 调整）
  ───────────────────────────────────────────────────────────────────
  · 纯静态单文件：无外部依赖，双击直接打开（file:// 可用）。
  · 全部为 fake 数据：数据定义在脚本开头 FAKE_DOCS。
  · 本 demo 用于「确定页面设计」，交互均为模拟，不请求真实后端。
  · v1 主要变更（详见 方案设计.md §9）：
      1) 风格：Elevated Card（无边框+阴影）、无渐变、纯色背景（对齐 ChatPage）
      2) doc-item 瘦身：仅 标题 + 摘要（两行 clamp + 展开/收起）
      3) 添加文档：入口移至 panel-header；列表 ⇄ 导入 横向滑动；切换按钮同位
      4) panel-header：总数小字、文字胶囊「刷新」（点击后 Shimmer「正在刷新...」）
      5) preview-header：标题 + PDF/Chunks Json/删除 + 最右侧 Text-in-Thumb 开关
      6) preview-footer 移除
      7) chunks 模式：splitter split 风格 + 最右侧 ChunkRail（total chunk 标题、
         bar 自右向左延展、最右 chunk 编号、点击跳转、当前位置异色、悬停大小）
      8) demo-badge 移除（正式版无此 UI；demo 仅保留左下角低透明度水印）
  ═══════════════════════════════════════════════════════════════════
-->
<style>
/* ============ 主题变量（v1：纯色、无渐变、Elevated Card） ============ */
:root {
  color-scheme: light;
  --bg: #f3f5f7;
  --panel: #ffffff;
  --panel-2: #f7f9fc;
  --text: #1f2d3d;
  --muted: #7a869a;
  --brand: #1aa7ff;
  --brand-press: #0e93e8;
  --brand-tint: rgba(26, 167, 255, 0.08);
  --danger: #e74c3c;
  --danger-tint: rgba(231, 76, 60, 0.10);
  --info: #3498db;
  --warning: #f39c12;
  --success: #2ecc71;
  /* Elevated Card 阴影层级 */
  --sh-1: 0 1px 2px rgba(31, 45, 61, 0.06), 0 1px 6px rgba(31, 45, 61, 0.04);
  --sh-2: 0 2px 6px rgba(31, 45, 61, 0.06), 0 8px 24px rgba(31, 45, 61, 0.08);
  --sh-3: 0 6px 16px rgba(31, 45, 61, 0.10), 0 16px 40px rgba(31, 45, 61, 0.12);
  --rail-bar: #d3d7dd;
  --log-line: #56657a;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1219;
  --panel: #171c26;
  --panel-2: #1d232e;
  --text: #e7ecf5;
  --muted: #8b96a8;
  --brand: #2bb1ff;
  --brand-press: #59c1ff;
  --brand-tint: rgba(43, 177, 255, 0.12);
  --danger: #e74c3c;
  --danger-tint: rgba(231, 76, 60, 0.14);
  --sh-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 6px rgba(0, 0, 0, 0.3);
  --sh-2: 0 2px 6px rgba(0, 0, 0, 0.45), 0 10px 28px rgba(0, 0, 0, 0.45);
  --sh-3: 0 8px 20px rgba(0, 0, 0, 0.55), 0 20px 48px rgba(0, 0, 0, 0.5);
  --rail-bar: #3a4456;
  --log-line: #a9b4c5;
}

/* ============ 基础 ============ */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
  background: var(--bg);            /* v1：纯色背景，无渐变 */
  color: var(--text);
}
button { font-family: inherit; }

/* ============ 应用骨架 ============ */
.app-shell { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ============ 顶部导航栏（v1：扁平、无渐变、无边框） ============ */
.navbar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 14px;
  padding: 10px 20px;
  background: var(--panel);
  box-shadow: var(--sh-1);
  position: relative;
  z-index: 5;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo {
  width: 34px; height: 34px; border-radius: 10px;
  background: var(--brand);          /* v1：纯色 logo，无渐变 */
  box-shadow: 0 6px 14px rgba(26, 167, 255, 0.3);
  flex: 0 0 auto;
}
.title { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.title strong { font-size: 14px; white-space: nowrap; }
.title span { font-size: 12px; color: var(--muted); margin-top: 3px; }
.tabs { display: flex; gap: 6px; margin-left: auto; }
.tab {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--panel-2); color: var(--muted);
  padding: 7px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
  border: none;
  box-shadow: var(--sh-1);
  transition: color .15s, background .15s;
}
.tab:hover { color: var(--text); }
.tab.active { background: var(--brand); color: #fff; }
.tab.active:hover { background: var(--brand-press); }
.theme-toggle {
  flex: 0 0 auto; border: none;
  background: var(--panel-2); color: var(--text);
  padding: 7px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
  box-shadow: var(--sh-1);
}

/* ============ 文档管理页：左右两张 Elevated Card ============ */
.docs-page {
  flex: 1 1 auto; min-height: 0;
  display: flex; gap: 16px;
  padding: 16px;
}
.elevated { background: var(--panel); border-radius: 16px; box-shadow: var(--sh-2); }

/* ---- 左卡片 ---- */
.left-panel {
  flex: 0 0 360px; width: 360px; min-width: 0;
  display: flex; flex-direction: column; overflow: hidden;
}

/* 横向滑轨舞台：[导入视图][列表视图] 并排，宽 200% */
.left-stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.stage-track {
  display: flex; width: 200%; height: 100%;
  transform: translateX(-50%);            /* 默认显示右侧的列表视图 */
  transition: transform 0.45s cubic-bezier(0.33, 1, 0.68, 1);
}
.left-stage.show-import .stage-track { transform: translateX(0); }
.view {
  flex: 0 0 50%; width: 50%; min-width: 0; height: 100%;
  display: flex; flex-direction: column; overflow: hidden;
}

/* panel-header：切换按钮（两视图同位）+ 标题块 + 操作 */
.panel-header {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
}
.head-title { flex: 1 1 auto; min-width: 0; }
.head-title h2 {
  margin: 0; font-size: 15px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.head-sub {
  display: block; margin-top: 3px;
  font-size: 12px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pill {
  flex: 0 0 auto;
  border: none;
  background: var(--panel-2); color: var(--muted);
  padding: 7px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
  box-shadow: var(--sh-1);
  transition: color .15s, background .15s, transform .05s;
}
.pill:hover { color: var(--text); }
.pill:active { transform: translateY(1px); }
.pill.primary { background: var(--brand); color: #fff; }
.pill.primary:hover { background: var(--brand-press); color: #fff; }
.pill:disabled { opacity: .55; cursor: default; }
/* 刷新中的 Shimmer 文案 */
.shimmer {
  color: transparent;
  background-image: linear-gradient(100deg, #9aa6b2 30%, #e8ecf1 50%, #9aa6b2 70%);
  background-size: 200% 100%;
  background-clip: text;
  -webkit-background-clip: text;
  animation: shimmer 1.1s ease-in-out infinite;
}
@keyframes shimmer { 0% { background-position: 120% 0; } 100% { background-position: -80% 0; } }

/* ---- 文档列表（v1 瘦身 item） ---- */
.doc-list-scroll {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  padding: 4px 12px 14px;
  display: flex; flex-direction: column; gap: 8px;
}
.doc-list-empty { margin: auto; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8; }
.doc-item {
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--panel);
  box-shadow: var(--sh-1);
  cursor: pointer;
  transition: box-shadow .15s, background .15s;
}
.doc-item:hover { box-shadow: var(--sh-2); }
.doc-item.selected { background: var(--brand-tint); box-shadow: var(--sh-2); }
.doc-title {
  font-weight: 600; font-size: 14px; line-height: 1.4;
  word-break: break-all;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
}
/* 摘要：默认两行 + …（line-clamp 自带省略号） */
.doc-abstract {
  margin: 6px 0 0;
  font-size: 12px; line-height: 1.6; color: var(--muted);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.doc-abstract.expanded { display: block; -webkit-line-clamp: unset; }
.abstract-toggle {
  display: block; margin: 4px 0 0 auto;
  border: none; background: none; padding: 0;
  font-size: 12px; color: var(--brand); cursor: pointer;
}
.abstract-toggle:hover { color: var(--brand-press); text-decoration: underline; }

/* ---- 导入视图 ---- */
.import-body {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  padding: 4px 14px 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.upload-area {
  border: 2px dashed var(--info); border-radius: 12px;
  background: var(--panel);
  padding: 26px 18px; text-align: center; cursor: pointer;
  transition: background-color .2s;
}
.upload-area:hover { background-color: var(--brand-tint); }
.upload-icon { font-size: 36px; color: var(--info); margin-bottom: 8px; }
.upload-area p { margin: 0; }
.upload-area .sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
.file-list { display: flex; flex-direction: column; gap: 8px; }
.file-item {
  background: var(--panel-2); border-radius: 10px;
  box-shadow: var(--sh-1);
  padding: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
}
.file-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.file-name { font-weight: 600; font-size: 13px; word-break: break-all; }
.file-size { font-size: 12px; color: var(--muted); margin-top: 3px; }
.status-badge {
  flex: 0 0 auto; padding: 4px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap;
}
.status-uploading { background-color: var(--warning); }
.status-processing { background-color: var(--info); }
.status-completed { background-color: var(--success); }
.status-error { background-color: var(--danger); }
.log-details { margin-top: 8px; font-size: 12px; color: var(--muted); }
.log-details summary { cursor: pointer; user-select: none; }
.log-list { margin: 6px 0 0 4px; padding: 0; list-style: none; }
.log-list li { margin: 3px 0; line-height: 1.5; color: var(--log-line); display: flex; gap: 6px; align-items: baseline; }
.log-ico { flex: 0 0 auto; width: 14px; text-align: center; }
.log-ico.done { color: var(--success); }
.log-ico.running { color: var(--info); }
.log-ico.failed { color: var(--danger); }

/* ---- 右卡片：预览 ---- */
.preview-panel { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

.preview-header {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 16px;
  padding: 14px 20px;
}
.ph-main { flex: 1 1 auto; min-width: 0; }
.ph-title {
  display: inline-block; max-width: 100%;
  font-size: 16px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  vertical-align: middle;
}
.ph-title.empty { color: var(--muted); font-weight: 400; }
.ph-actions { display: inline-flex; gap: 6px; margin-left: 10px; vertical-align: middle; }
.ph-action {
  border: none;
  background: var(--panel-2); color: var(--muted);
  padding: 4px 10px; border-radius: 999px; font-size: 12px; cursor: pointer;
  box-shadow: var(--sh-1);
  transition: color .15s, background .15s;
}
.ph-action:hover { color: var(--text); }
.ph-action.danger { color: var(--danger); }
.ph-action.danger:hover { background: var(--danger-tint); color: var(--danger); }
.ph-meta {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  margin-top: 6px; font-size: 12px; color: var(--muted);
}
.kw-chip {
  font-size: 11px; padding: 1px 8px; border-radius: 999px;
  background: var(--panel-2); color: var(--muted);
  box-shadow: var(--sh-1);
}

/* Text-in-Thumb 开关（markdown | chunks） */
.mode-toggle {
  flex: 0 0 auto;
  position: relative;
  width: 176px; height: 32px;
  border: none; border-radius: 999px;
  background: var(--panel-2);
  box-shadow: inset 0 1px 3px rgba(31, 45, 61, 0.12);
  cursor: pointer; padding: 0;
}
.mode-thumb {
  position: absolute; top: 4px; left: 4px;
  width: calc(50% - 4px); height: 24px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 999px;
  background: var(--panel);
  box-shadow: var(--sh-2);
  font-size: 12px; font-weight: 600; color: var(--brand);
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
}
.mode-toggle.chunks .mode-thumb { transform: translateX(100%); }
.mode-toggle:disabled { opacity: .5; cursor: not-allowed; }

/* preview-body：chunks 模式下 = 滚动区 + 右侧 ChunkRail */
.preview-body { flex: 1 1 auto; min-height: 0; display: flex; }
.preview-scroll {
  flex: 1 1 auto; min-width: 0; overflow-y: auto;
  padding: 4px 24px 40px;
}
.preview-inner { max-width: 820px; margin: 0 auto; }

/* 空态 */
.preview-empty {
  height: 100%; min-height: 260px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  color: var(--muted); text-align: center;
}
.preview-empty-icon { font-size: 40px; opacity: .7; }
.preview-empty-title { margin: 0; font-size: 15px; color: var(--text); }
.preview-empty-sub { margin: 0; font-size: 13px; }

/* 骨架屏 */
.skeleton { border-radius: 8px; background: linear-gradient(100deg, var(--panel-2) 30%, #dde2ea 50%, var(--panel-2) 70%); background-size: 200% 100%; animation: shimmer 1.2s ease-in-out infinite; }
[data-theme="dark"] .skeleton { background-image: linear-gradient(100deg, var(--panel-2) 30%, #2a3140 50%, var(--panel-2) 70%); }
.sk-line { height: 14px; margin-bottom: 12px; }
.sk-line.w60 { width: 60%; }
.sk-line.w80 { width: 80%; }
.sk-line.w40 { width: 40%; }

/* markdown 正文提示行（chunks 信息在 body 呈现） */
.body-info {
  font-size: 12px; color: var(--muted);
  margin: 2px 0 14px;
}

/* markdown 渲染（内容排版沿用 global.css 子集） */
.markdown { font-size: 15px; line-height: 1.7; overflow-wrap: break-word; }
.markdown > :first-child { margin-top: 0; }
.markdown h1, .markdown h2, .markdown h3, .markdown h4 { margin: 1em 0 .5em; font-weight: 600; line-height: 1.35; }
.markdown h1 { font-size: 1.4em; }
.markdown h2 { font-size: 1.25em; }
.markdown h3 { font-size: 1.1em; }
.markdown h4 { font-size: 1em; }
.markdown ul, .markdown ol { margin: .5em 0; padding-left: 1.5em; }
.markdown li { margin: .25em 0; }
.markdown blockquote {
  margin: .6em 0; padding: 2px 12px;
  border-left: 3px solid var(--brand);
  background: var(--panel-2); border-radius: 0 8px 8px 0; color: var(--muted);
}
.markdown code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .85em; background: var(--panel-2); border-radius: 5px; padding: .1em .35em;
}
.markdown pre { margin: .6em 0; padding: 12px 14px; background: var(--panel-2); border-radius: 10px; overflow-x: auto; }
.markdown pre code { background: none; padding: 0; white-space: pre; }
.markdown a { color: var(--brand); text-decoration: none; }
.markdown a:hover { text-decoration: underline; }
.markdown hr { border: none; border-top: 1px solid #d3d7dd; margin: 1em 0; }
.markdown table { border-collapse: collapse; margin: .6em 0; max-width: 100%; display: block; overflow-x: auto; }
.markdown th, .markdown td { border: 1px solid #d3d7dd; padding: 6px 10px; font-size: .92em; }
.markdown th { background: var(--panel-2); font-weight: 600; }
.demo-img {
  display: inline-flex; flex-direction: column; gap: 2px; align-items: flex-start;
  border-radius: 10px;
  background: var(--panel-2); color: var(--text);
  box-shadow: var(--sh-1);
  padding: 8px 12px; margin: 4px 0; font-size: 13px;
}
.demo-img small { font-size: 11px; color: var(--muted); word-break: break-all; }

/* ---- chunks 卡片（splitter split 风格 + Elevated Card 化） ---- */
.chunk-card {
  border-radius: 12px;
  background: var(--panel);
  box-shadow: var(--sh-2);
  overflow: hidden;
}
.chunk-card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px;
  background: var(--panel-2);
  font-size: 12px; color: var(--muted);
}
.chunk-badge {
  background: var(--brand-tint); color: var(--brand);
  font-weight: 650; font-size: 11px;
  padding: 2px 9px; border-radius: 999px;
  white-space: nowrap;
}
.chunk-title-stack {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px; color: var(--text); font-weight: 550;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0;
}
.chunk-level {
  flex: 0 0 auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10.5px; font-weight: 650;
  color: #7c3aed; background: #f3e8ff;
  padding: 2px 7px; border-radius: 6px;
}
[data-theme="dark"] .chunk-level { background: #2c2140; color: #c4a6ff; }
.chunk-size-note {
  margin-left: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px; color: var(--muted);
  white-space: nowrap;
}
.chunk-card-body { padding: 14px 20px; font-size: 14px; }

/* split 边界标记（切分可视化，虚线为内容语义而非 UI 分割线） */
.split-marker {
  display: flex; align-items: center; gap: 10px;
  margin: 12px 4px;
  font-size: 11px; font-weight: 600;
  color: var(--muted); letter-spacing: 0.02em;
}
.split-marker::before, .split-marker::after {
  content: ""; flex: 1;
  border-top: 1.5px dashed #cfd4db;
}
.split-marker .scissors { color: var(--brand); }

/* ---- ChunkRail（最右侧长度分布条，仿 splitter，方向镜像） ---- */
.chunk-rail {
  flex: 0 0 132px; width: 132px; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  padding: 16px 12px 40px 8px;
  background: var(--panel-2);
  border-radius: 0 16px 16px 0;
  scrollbar-width: thin;
}
.chunk-rail[hidden] { display: none; }
.rail-caption {
  position: sticky; top: 0; z-index: 1;
  padding-bottom: 8px;
  font-size: 10px; font-weight: 650; letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--panel-2);
}
.rail-row {
  display: flex; align-items: center; justify-content: flex-end; gap: 6px;
  margin-bottom: 6px;
}
/* bar 右对齐、自右向左延展 */
.rail-bar {
  display: block;
  height: 9px; min-width: 4px;
  padding: 0; border: none; border-radius: 3px;
  background: var(--rail-bar);
  cursor: pointer;
  transition: background .15s;
}
.rail-bar:hover { background: var(--muted); }
.rail-bar.active {
  background: var(--brand);
  box-shadow: 0 0 0 2px var(--brand-tint);
}
.rail-num {
  flex: 0 0 22px; width: 22px; text-align: right;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px; color: var(--muted);
}
/* 悬停气泡 */
.rail-tip {
  position: fixed; z-index: 60;
  padding: 5px 9px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px; line-height: 1.3;
  color: #fff; background: rgba(31, 35, 40, 0.92);
  border-radius: 7px; white-space: nowrap;
  pointer-events: none;
  transform: translateY(-50%);
}
.rail-tip[hidden] { display: none; }

/* toast（Elevated，色点提示） */
.toast-wrap { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
.toast {
  display: flex; align-items: flex-start; gap: 8px;
  background: var(--panel); border-radius: 12px;
  padding: 10px 14px; box-shadow: var(--sh-3);
  font-size: 13px; max-width: 340px;
  animation: toast-in .2s ease-out;
}

/* ═══════════════════════════════════════════════════════════════
 * 模拟后端切分（简化移植 src/utils/markdown_splitter.py）
 * ═══════════════════════════════════════════════════════════════ */
function fakeSplitByTitle(md) {
  const chunks = [];
  const lines = md.split(/\r?\n/);
  const titleRe = /^(#{1,6})\s+(.*)$/;
  let titleStack = [];
  let level = 0;
  let contentLines = [];
  const flush = () => {
    const content = contentLines.join("\n").trim();
    if (content) chunks.push({ content, level, title_stack: [...titleStack] });
  };
  for (const line of lines) {
    if (!line.trim()) { contentLines.push(line); continue; }
    const m = titleRe.exec(line);
    if (m) {
      flush();
      contentLines = [];
      level = m[1].length;
      const text = m[2];
      while (titleStack.length < level) titleStack.push(null);
      titleStack[level - 1] = text;
      titleStack.length = level;
    } else {
      contentLines.push(line);
    }
  }
  flush();
  return chunks;
}

/* ═══════════════════════════════════════════════════════════════
 * 迷你 markdown 渲染器（demo 用，真实实现复用 react-markdown）
 * ═══════════════════════════════════════════════════════════════ */
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function inlineMd(s) {
  let out = escapeHtml(s);
  out = out.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_m, alt, url) => {
    const name = decodeURIComponent(url.split("/").pop() || url);
    return `<span class="demo-img">📷 ${escapeHtml(alt || name)}<small>minio://markdown-images/…/${escapeHtml(name)}</small></span>`;
  });
  out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return out;
}
function splitTableRow(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((s) => s.trim());
}
function renderMarkdown(src) {
  const lines = src.split(/\r?\n/);
  const html = [];
  const fenceRe = /^\s*(`{3,}|~{3,})/;
  const isTableStart = (i) =>
    lines[i].includes("|") &&
    i + 1 < lines.length &&
    /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) &&
    lines[i + 1].includes("-");
  const startsBlock = (i) => {
    const l = lines[i];
    return (
      /^\s*(#{1,6}\s|>|[-*+]\s|\d+[.)]\s)/.test(l) ||
      fenceRe.test(l) ||
      isTableStart(i) ||
      /^\s*(-{3,}|\*{3,})\s*$/.test(l)
    );
  };

  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (fenceRe.test(line)) {
      const fence = line.trim().charAt(0);
      const buf = [];
      i++;
      while (i < lines.length && !new RegExp("^\\s*" + fence + "{3,}").test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      html.push(`<pre><code>${escapeHtml(buf.join("\n"))}</code></pre>`);
      continue;
    }
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) {
      const n = h[1].length;
      html.push(`<h${n}>${inlineMd(h[2])}</h${n}>`);
      i++;
      continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { html.push("<hr>"); i++; continue; }
    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      html.push(`<blockquote>${inlineMd(buf.join(" "))}</blockquote>`);
      continue;
    }
    if (isTableStart(i)) {
      const head = splitTableRow(lines[i]);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|")) { rows.push(splitTableRow(lines[i])); i++; }
      html.push(
        "<table><thead><tr>" + head.map((c) => `<th>${inlineMd(c)}</th>`).join("") + "</tr></thead><tbody>" +
        rows.map((r) => "<tr>" + r.map((c) => `<td>${inlineMd(c)}</td>`).join("") + "</tr>").join("") +
        "</tbody></table>"
      );
      continue;
    }
    if (/^\s*[-*+]\s+/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*[-*+]\s+/, "")); i++; }
      html.push("<ul>" + buf.map((x) => `<li>${inlineMd(x)}</li>`).join("") + "</ul>");
      continue;
    }
    if (/^\s*\d+[.)]\s+/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*\d+[.)]\s+/, "")); i++; }
      html.push("<ol>" + buf.map((x) => `<li>${inlineMd(x)}</li>`).join("") + "</ol>");
      continue;
    }
    if (!line.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !startsBlock(i)) { buf.push(lines[i]); i++; }
    html.push(`<p>${inlineMd(buf.join(" "))}</p>`);
  }
  return html.join("\n");
}

}
function findDoc(docId) {
  return state.docs.find((d) => d.doc_id === docId);
}

/* ═══════════════════════════════════════════════════════════════
 * 左卡片：文档列表（v1 瘦身 item：标题 + 摘要两行 clamp + 展开/收起）
 * ═══════════════════════════════════════════════════════════════ */
function renderDocList() {
  docCountText.textContent = `当前文档总数: ${state.docs.length}`;
  if (state.docs.length === 0) {
    docListScroll.innerHTML = `<div class="doc-list-empty">📭 文库为空<br>点击左上角「添加文档」导入第一篇文档</div>`;
    return;
  }
  docListScroll.innerHTML = "";
  for (const doc of state.docs) {
    const item = document.createElement("div");
    item.className = "doc-item" + (doc.doc_id === state.selectedId ? " selected" : "");
    item.innerHTML = `
      <div class="doc-title">${escapeHtml(doc.file_title)}</div>
      <p class="doc-abstract" data-expanded="0">${escapeHtml(doc.docs_abstract)}</p>
      <button class="abstract-toggle" type="button">展开</button>`;

    item.addEventListener("click", () => selectDoc(doc.doc_id));
    item.querySelector(".abstract-toggle").addEventListener("click", (e) => {
      e.stopPropagation();                     // 展开/收起不触发选中
      const abs = item.querySelector(".doc-abstract");
      const btn = item.querySelector(".abstract-toggle");
      if (abs.dataset.expanded === "1") {
        abs.dataset.expanded = "0";
        abs.classList.remove("expanded");
        btn.textContent = "展开";
      } else {
        abs.dataset.expanded = "1";
        abs.classList.add("expanded");
        btn.textContent = "收起";
      }
    });

    docListScroll.appendChild(item);
  }
}

/* ═══════════════════════════════════════════════════════════════
 * 横向切换：列表 ⇄ 导入（同一位置切换按钮，无需移动鼠标）
 * ═══════════════════════════════════════════════════════════════ */
function setView(view) {
  leftStage.classList.toggle("show-import", view === "import");
  if (view === "import") seedImportTasks();
}

/* ═══════════════════════════════════════════════════════════════
 * 刷新（点击后总数文字变 Shimmer「正在刷新...」）
 * ═══════════════════════════════════════════════════════════════ */
function refreshList() {
  if (state.refreshing) return;
  state.refreshing = true;
  refreshBtn.disabled = true;
  docCountText.textContent = "正在刷新...";
  docCountText.classList.add("shimmer");
  setTimeout(() => {
    docCountText.classList.remove("shimmer");
    renderDocList();
    refreshBtn.disabled = false;
    state.refreshing = false;
    toast("列表已刷新（demo：真实环境为重新 GET /api/docs）", "success");
  }, 900);
}

/* ═══════════════════════════════════════════════════════════════
 * 右卡片：选中与预览
 * ═══════════════════════════════════════════════════════════════ */
function selectDoc(docId) {
  const doc = findDoc(docId);
  if (!doc) return;
  state.selectedId = docId;
  state.previewMode = "markdown";            // 新选中默认 Markdown 视图
  renderDocList();
  renderPreviewHeader(doc);
  enableToggle(true);
  showSkeleton();
  if (state.previewTimer) clearTimeout(state.previewTimer);
  state.previewTimer = setTimeout(() => renderPreviewContent(doc), 500);  // 模拟 fetch 延迟
}

function renderPreviewHeader(doc) {
  const pdfBtn = doc.file_type === "pdf"
    ? '<button class="ph-action" id="pdfBtn" type="button">PDF</button>' : "";
  const kwChips = doc.docs_keywords.split(/[,，]/).map((k) => k.trim()).filter(Boolean)
    .map((k) => `<span class="kw-chip">${escapeHtml(k)}</span>`).join("");
  const typeText = doc.file_type === "pdf" ? "PDF 文档" : doc.file_type === "markdown" ? "Markdown 文档" : "未知类型";
  phMain.innerHTML = `
    <div>
      <span class="ph-title">${escapeHtml(doc.file_title)}</span>
      <span class="ph-actions">
        ${pdfBtn}
        <button class="ph-action" id="chunksJsonBtn" type="button">Chunks Json</button>
        <button class="ph-action danger" id="deleteBtn" type="button">删除</button>
      </span>
    </div>
    <div class="ph-meta">${escapeHtml(typeText)} · 关键词：${kwChips || "—"}</div>`;
  $("#pdfBtn")?.addEventListener("click", () => {
    toast(`demo：真实环境将新标签页打开 GET /api/docs/${doc.doc_id}/artifact?kind=origin（PDF 预览）`, "info");
  });
  $("#chunksJsonBtn").addEventListener("click", () => openChunksJson(doc));
  $("#deleteBtn").addEventListener("click", () => openDeleteModal(doc));
}

function enableToggle(on) {
  modeToggle.disabled = !on;
  modeToggle.setAttribute("aria-checked", "false");
  setModeActive();
}

function setModeActive() {
  modeToggle.classList.toggle("chunks", state.previewMode === "chunks");
  modeThumb.textContent = state.previewMode;
}

function showSkeleton() {
  hideRail();
  previewScroll.innerHTML = `<div class="preview-inner">
    <div class="skeleton sk-line w60"></div>
    <div class="skeleton sk-line"></div>
    <div class="skeleton sk-line"></div>
    <div class="skeleton sk-line w80"></div>
    <div class="skeleton sk-line w40"></div>
  </div>`;
}

function renderPreviewContent(doc) {
  if (state.previewMode === "markdown") renderMarkdownView(doc);
  else renderChunksView(doc);
}

function renderMarkdownView(doc) {
  hideRail();
  const inner = document.createElement("div");
  inner.className = "preview-inner";
  inner.innerHTML = `
    <div class="body-info">共 ${doc.chunks.length} 个 chunk · 切换右上角开关可查看分段视图</div>
    <div class="markdown">${renderMarkdown(doc.markdown)}</div>`;
  previewScroll.innerHTML = "";
  previewScroll.appendChild(inner);
}

function renderChunksView(doc) {
  const inner = document.createElement("div");
  inner.className = "preview-inner";
  doc.chunks.forEach((chunk, idx) => {
    const title = (chunk.title_stack || []).filter(Boolean).join(" › ");
    const level = Number.isFinite(chunk.level) ? chunk.level : 0;
    const card = document.createElement("div");
    card.className = "chunk-card";
    card.dataset.chunkIndex = String(idx);
    card.innerHTML = `
      <div class="chunk-card-head">
        <span class="chunk-badge">Chunk ${idx + 1}</span>
        ${title ? `<span class="chunk-title-stack" title="${escapeHtml(title)}">${escapeHtml(title)}</span>` : ""}
        <span class="chunk-level">${level > 0 ? "H" + level : "top"}</span>
        <span class="chunk-size-note">${chunk.content.length.toLocaleString()} chars</span>
      </div>
      <div class="chunk-card-body markdown">${renderMarkdown(chunk.content)}</div>`;
    inner.appendChild(card);
    if (idx < doc.chunks.length - 1) {
      const marker = document.createElement("div");
      marker.className = "split-marker";
      marker.innerHTML = `<span class="scissors">✂</span> split ${idx + 1} → ${idx + 2}`;
      inner.appendChild(marker);
    }
  });
  previewScroll.innerHTML = "";
  previewScroll.appendChild(inner);
  renderRail(doc);
}

/* ═══════════════════════════════════════════════════════════════
 * ChunkRail（§9.3）：total chunk 标题 / bar 自右向左 / 最右编号 /
 * 点击跳转 / 滚动联动高亮 / 悬停大小
 * ═══════════════════════════════════════════════════════════════ */
const RAIL_MIN_RATIO = 0.05;
const RAIL_TOP_PAD = 34;
const RAIL_BOTTOM_PAD = 12;

function hideRail() {
  chunkRail.hidden = true;
  chunkRail.innerHTML = "";
  state.railSizes = [];
  state.activeBarIndex = -1;
  hideTip();
}

function renderRail(doc) {
  state.railSizes = doc.chunks.map((c) => (c.content || "").length);
  const max = state.railSizes.reduce((m, n) => Math.max(m, n), 0) || 1;
  let html = `<div class="rail-caption">total chunk: ${state.railSizes.length}</div>`;
  state.railSizes.forEach((n, i) => {
    const pct = Math.max(RAIL_MIN_RATIO, n / max) * 100;
    html += `
      <div class="rail-row">
        <button class="rail-bar" type="button" data-index="${i}" aria-label="Chunk ${i + 1}, ${n} chars" style="width:${pct.toFixed(2)}%"></button>
        <span class="rail-num">${i + 1}</span>
      </div>`;
  });
  chunkRail.innerHTML = html;
  chunkRail.hidden = false;
  state.activeBarIndex = -1;
  setActiveBar(activeIndexFromScroll());
}

function railBars() { return chunkRail.querySelectorAll(".rail-bar"); }

function setActiveBar(index) {
  if (!state.railSizes.length) return;
  const next = Math.min(state.railSizes.length - 1, Math.max(0, Number.isFinite(index) ? index : 0));
  if (next === state.activeBarIndex) return;
  const bars = railBars();
  const prev = bars[state.activeBarIndex];
  if (prev) prev.classList.remove("active");
  const bar = bars[next];
  if (bar) {
    bar.classList.add("active");
    ensureBarVisible(bar);
  }
  state.activeBarIndex = next;
}

function ensureBarVisible(bar) {
  const railRect = chunkRail.getBoundingClientRect();
  const r = bar.getBoundingClientRect();
  if (r.top < railRect.top + RAIL_TOP_PAD) {
    chunkRail.scrollTop -= railRect.top + RAIL_TOP_PAD - r.top;
  } else if (r.bottom > railRect.bottom - RAIL_BOTTOM_PAD) {
    chunkRail.scrollTop += r.bottom - (railRect.bottom - RAIL_BOTTOM_PAD);
  }
}

/* 「阅读线」（滚动容器顶部往下一点）落在哪个 chunk 卡片上 */
function activeIndexFromScroll() {
  const cards = previewScroll.querySelectorAll("[data-chunk-index]");
  if (!cards.length) return 0;
  const containerTop = previewScroll.getBoundingClientRect().top;
  let index = Number(cards[0].dataset.chunkIndex) || 0;
  for (const el of cards) {
    if (el.getBoundingClientRect().top <= containerTop + 8) {
      index = Number(el.dataset.chunkIndex) || 0;
    } else {
      break;
    }
  }
  return index;
}

function onPreviewScroll() {
  hideTip();
  if (!state.railSizes.length || state.railFrame) return;
  state.railFrame = requestAnimationFrame(() => {
    state.railFrame = 0;
    setActiveBar(activeIndexFromScroll());
  });
}

function scrollToChunk(index) {
  const el = previewScroll.querySelector(`[data-chunk-index="${index}"]`);
  if (!el) return;
  const top = el.getBoundingClientRect().top - previewScroll.getBoundingClientRect().top + previewScroll.scrollTop - 12;
  previewScroll.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
  setActiveBar(index);
}

function showTip(bar) {
  const index = Number(bar.dataset.index);
  const n = state.railSizes[index] || 0;
  railTip.textContent = `Chunk ${index + 1} · ${n.toLocaleString("zh-CN")} chars`;
  railTip.hidden = false;
  const r = bar.getBoundingClientRect();
  const tip = railTip.getBoundingClientRect();
  let left = r.left - tip.width - 10;
  if (left < 8) left = Math.min(window.innerWidth - tip.width - 8, r.right + 10);
  const half = tip.height / 2;
  const top = Math.min(Math.max(r.top + r.height / 2, half + 6), window.innerHeight - half - 6);
  railTip.style.left = `${left}px`;
  railTip.style.top = `${top}px`;
}
function hideTip() { railTip.hidden = true; }

chunkRail.addEventListener("click", (e) => {
  const bar = e.target.closest(".rail-bar");
  if (bar) scrollToChunk(Number(bar.dataset.index));
});
chunkRail.addEventListener("mouseover", (e) => {
  const bar = e.target.closest(".rail-bar");
  if (bar) showTip(bar);
});
chunkRail.addEventListener("mouseleave", hideTip);
chunkRail.addEventListener("mouseout", (e) => {
  const to = e.relatedTarget;
  if (!to || typeof to.closest !== "function" || !to.closest(".rail-bar")) hideTip();
});
chunkRail.addEventListener("scroll", hideTip, { passive: true });
previewScroll.addEventListener("scroll", onPreviewScroll, { passive: true });
window.addEventListener("resize", hideTip);

/* ═══════════════════════════════════════════════════════════════
 * Text-in-Thumb 开关
 * ═══════════════════════════════════════════════════════════════ */
modeToggle.addEventListener("click", () => {
  if (!state.selectedId) return;
  const doc = findDoc(state.selectedId);
  if (!doc) return;
  state.previewMode = state.previewMode === "markdown" ? "chunks" : "markdown";
  setModeActive();
  showSkeleton();
  if (state.previewTimer) clearTimeout(state.previewTimer);
  state.previewTimer = setTimeout(() => renderPreviewContent(doc), 300);
});

/* 空态复位 */
function resetPreview() {
  state.selectedId = null;
  state.previewMode = "markdown";
  enableToggle(false);
  phMain.innerHTML = `<span class="ph-title empty">未选择文档</span>`;
  hideRail();
  previewScroll.innerHTML = `
    <div class="preview-empty">
      <div class="preview-empty-icon">📄</div>
      <p class="preview-empty-title">在左侧选择一篇文档</p>
      <p class="preview-empty-sub">选中后将在此渲染文档的 Markdown，右上角开关可切换 Chunks 分段视图</p>
    </div>`;
  if (state.previewTimer) { clearTimeout(state.previewTimer); state.previewTimer = null; }
}

/* ═══════════════════════════════════════════════════════════════
 * 删除：二次确认弹窗
 * ═══════════════════════════════════════════════════════════════ */
function openDeleteModal(doc) {
  state.deletingId = doc.doc_id;
  modalDocTitle.textContent = `《${doc.file_title}》`;
  modalMask.classList.remove("hidden");
}
function confirmDelete() {
  const docId = state.deletingId;
  state.deletingId = null;
  modalMask.classList.add("hidden");
  const doc = findDoc(docId);
  state.docs = state.docs.filter((d) => d.doc_id !== docId);
  if (state.selectedId === docId) resetPreview();
  renderDocList();
  toast(`已删除《${doc.file_title}》（demo：真实环境将级联删除 Milvus docs/chunks 与 MinIO 三份制品）`, "success");
}

/* Chunks Json：新标签页查看（demo 用 Blob URL 模拟） */
function openChunksJson(doc) {
  const blob = new Blob([JSON.stringify(doc.chunks, null, 2)], { type: "application/json" });
  window.open(URL.createObjectURL(blob), "_blank");
  toast(`demo：真实环境将新标签页打开 GET /api/docs/${doc.doc_id}/artifact?kind=chunks`, "info");
}

/* ═══════════════════════════════════════════════════════════════
 * 导入视图：模拟上传任务（真实实现为 upload + 轮询平移）
 * ═══════════════════════════════════════════════════════════════ */
const FAKE_TASKS = [
  { name: "产品手册-新版本.pdf", sizeKB: "1.24 MB", steps: ["上传文件", "PDF 解析 (MinerU)", "图片识别 (VLM)", "文档切分与向量化"], failAt: null },
  { name: "旧版说明.md", sizeKB: "38.2 KB", steps: ["上传文件", "文档切分", "关键词/摘要生成", "文档切分与向量化"], failAt: "文档切分与向量化" },
];
const STATUS_LABELS = { uploading: "上传中...", processing: "处理中...", completed: "已完成", error: "失败" };

function seedImportTasks() {
  if (state.importSeeded) return;
  state.importSeeded = true;
  FAKE_TASKS.forEach((task) => {
    const item = createUploadItem(task);
    importFileList.appendChild(item);
    runUploadSimulation(item, task);
  });
}

function createUploadItem(task) {
  const item = document.createElement("div");
  item.className = "file-item";
  item.innerHTML = `
    <div class="file-info">
      <span class="file-name">${escapeHtml(task.name)}</span>
      <span class="file-size">${task.sizeKB}</span>
      <details class="log-details" open>
        <summary>已耗时 0.0s，点击收起 / 展开</summary>
        <ul class="log-list"></ul>
      </details>
    </div>
    <div class="status-badge status-uploading">${STATUS_LABELS.uploading}</div>`;
  return item;
}

function runUploadSimulation(item, task) {
  const startedAt = Date.now();
  const badge = item.querySelector(".status-badge");
  const summary = item.querySelector("summary");
  const logList = item.querySelector(".log-list");
  const tick = setInterval(() => {
    summary.textContent = `已耗时 ${((Date.now() - startedAt) / 1000).toFixed(1)}s，点击收起 / 展开`;
  }, 500);

  let step = 0;
  let done = 0;
  const advance = () => {
    if (step < task.steps.length) {
      badge.textContent = STATUS_LABELS[step === 0 ? "uploading" : "processing"];
      badge.className = "status-badge " + (step === 0 ? "status-uploading" : "status-processing");
      const label = task.steps[step];
      if (step === 0) done = 1;
      renderLogLines(logList, task.steps.slice(0, done), [label], []);
      step++;
      setTimeout(advance, 1000 + Math.random() * 600);
      return;
    }
    clearInterval(tick);
    summary.textContent = `已耗时 ${((Date.now() - startedAt) / 1000).toFixed(1)}s，点击收起 / 展开`;
    if (task.failAt) {
      badge.textContent = STATUS_LABELS.error;
      badge.className = "status-badge status-error";
      renderLogLines(logList, task.steps, [], [task.failAt]);
      toast(`导入失败：${task.name}（demo 模拟「${task.failAt}」节点失败）`, "error", 5000);
    } else {
      badge.textContent = STATUS_LABELS.completed;
      badge.className = "status-badge status-completed";
      renderLogLines(logList, task.steps, [], []);
      toast(`导入完成：${task.name}`, "success");
      autoRefreshAfterImport();
    }
  };
  setTimeout(advance, 800);
}

function renderLogLines(logList, doneList, runningList, failedList) {
  const line = (kind, text) => {
    const ico = kind === "done" ? "✓" : kind === "running" ? "⏳" : "✗";
    return `<li><span class="log-ico ${kind}">${ico}</span><span>${escapeHtml(text)}</span></li>`;
  };
  logList.innerHTML =
    doneList.map((t) => line("done", t)).join("") +
    failedList.map((t) => line("failed", t)).join("") +
    runningList.map((t) => line("running", t)).join("");
}

function addFakeUpload() {
  const task = { name: `演示文档-${Date.now() % 1000}.pdf`, sizeKB: "512.0 KB", steps: ["上传文件", "PDF 解析 (MinerU)", "文档切分与向量化"], failAt: null };
  const item = createUploadItem(task);
  importFileList.prepend(item);
  runUploadSimulation(item, task);
}

/* 导入完成 → 列表自动刷新（后台刷新，不强制切回列表视图） */
function autoRefreshAfterImport() {
  if (findDoc(FAKE_NEW_DOC.doc_id)) return;
  const newDoc = { ...FAKE_NEW_DOC };
  newDoc.chunks = fakeSplitByTitle(newDoc.markdown);
  state.docs = [newDoc, ...state.docs];
  renderDocList();
  toast("文档列表已自动刷新（导入完成 → 后台刷新）", "success");
}

/* ═══════════════════════════════════════════════════════════════
 * 事件绑定
 * ═══════════════════════════════════════════════════════════════ */
$("#addDocBtn").addEventListener("click", () => setView("import"));
$("#backToListBtn").addEventListener("click", () => setView("list"));
$("#uploadArea").addEventListener("click", addFakeUpload);
refreshBtn.addEventListener("click", refreshList);
$("#modalCancelBtn").addEventListener("click", () => {
  state.deletingId = null;
  modalMask.classList.add("hidden");
});
$("#modalOkBtn").addEventListener("click", confirmDelete);

/* 主题切换 */
const themeToggle = $("#themeToggle");
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  themeToggle.textContent = theme === "dark" ? "☀️ 浅色" : "🌙 深色";
  localStorage.setItem("docs_demo_theme", theme);
}
applyTheme(
  localStorage.getItem("docs_demo_theme") ||
  (window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "dark" : "light")
);
themeToggle.addEventListener("click", () => {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

/* 初始渲染：列表就绪，右半区为空态 */
renderDocList();
resetPreview();
</script>
