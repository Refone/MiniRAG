<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档管理页面 · demo（fake 数据）</title>
<!--
  ═══════════════════════════════════════════════════════════════════
  文档管理页面 · 交互原型 demo
  ───────────────────────────────────────────────────────────────────
  · 纯静态单文件：无任何外部依赖，双击直接打开（file:// 可用）。
  · 全部为 fake 数据：数据定义在脚本开头的 FAKE_DOCS（改那里即可换演示内容）。
  · 本 demo 用于「确定页面设计」，交互均为模拟，不请求真实后端。
  · 与方案设计（方案设计.md）的对应关系：
      - 左半区两视图卷帘门  → §3.2 / §5.4
      - 预览 markdown/chunks → §5.3（chunks 为 split 卡片，决策 D3）
      - 删除二次确认         → 决策 D4
      - 导入完成自动刷新列表 → 决策 D5
  ═══════════════════════════════════════════════════════════════════
-->
<style>
/* ============ 主题变量（对齐 web/src/styles/global.css） ============ */
:root {
  color-scheme: light;
  --bg: #f3f5f7;
  --bg-grad-1: rgba(26, 167, 255, 0.18);
  --bg-grad-2: rgba(91, 124, 250, 0.18);
  --panel: #ffffff;
  --panel-2: #f7f9fc;
  --text: #1f2d3d;
  --muted: #7a869a;
  --brand: #1aa7ff;
  --brand2: #5b7cfa;
  --border: #e6e9ef;
  --shadow: 0 10px 30px rgba(31, 45, 61, 0.12);
  --log-line: #56657a;
  --info: #3498db;
  --warning: #f39c12;
  --success: #2ecc71;
  --danger: #e74c3c;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1219;
  --bg-grad-1: rgba(26, 167, 255, 0.12);
  --bg-grad-2: rgba(91, 124, 250, 0.12);
  --panel: #171c26;
  --panel-2: #1d232e;
  --text: #e7ecf5;
  --muted: #8b96a8;
  --brand: #2bb1ff;
  --brand2: #7d94fb;
  --border: #2a3140;
  --shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
  --log-line: #a9b4c5;
}

/* ============ 基础 ============ */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
  background:
    radial-gradient(1200px 600px at 20% 0%, var(--bg-grad-1), transparent 60%),
    radial-gradient(1000px 500px at 90% 10%, var(--bg-grad-2), transparent 55%),
    var(--bg);
  color: var(--text);
}
button { font-family: inherit; }

/* ============ 应用骨架 ============ */
.app-shell { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ============ 顶部导航栏 ============ */
.navbar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(90deg, rgba(26,167,255,.1), rgba(91,124,250,.1));
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--brand), var(--brand2));
  box-shadow: 0 8px 18px rgba(26,167,255,.25);
  flex: 0 0 auto;
}
.title { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.title strong { font-size: 14px; white-space: nowrap; }
.title span { font-size: 12px; color: var(--muted); margin-top: 3px; }
.tabs { display: flex; gap: 6px; margin-left: auto; }
.tab {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); background: var(--panel); color: var(--muted);
  padding: 8px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
}
.tab.active {
  background: linear-gradient(135deg, var(--brand), var(--brand2));
  color: #fff; border-color: transparent;
}
.demo-badge {
  flex: 0 0 auto;
  font-size: 11px; color: var(--warning);
  border: 1px dashed var(--warning); border-radius: 999px;
  padding: 4px 10px; white-space: nowrap;
}
.theme-toggle {
  flex: 0 0 auto;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
  padding: 8px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
}

/* ============ 文档管理页 ============ */
.docs-page { flex: 1 1 auto; min-height: 0; display: flex; }

/* ---- 左半区 ---- */
.left-panel {
  flex: 0 0 380px; width: 380px; min-width: 0;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--panel);
}
/* 卷帘门舞台：两层视图上下叠放，列表视图在上层 */
.left-stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.view-list, .view-import {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  background: var(--panel);
}
.view-list {
  z-index: 2;
  transform: translateY(0);
  transition: transform 0.45s cubic-bezier(0.33, 1, 0.68, 1);
  box-shadow: 0 -6px 24px rgba(31,45,61,.10);
}
.left-stage.importing .view-list { transform: translateY(-100%); }

.panel-header {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.panel-header h2 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel-header .count { font-size: 12px; color: var(--muted); }
.icon-btn {
  flex: 0 0 auto;
  border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
  padding: 6px 10px; border-radius: 8px; font-size: 13px; cursor: pointer;
  transition: color .15s, border-color .15s;
}
.icon-btn:hover { color: var(--text); border-color: rgba(26,167,255,.5); }
.icon-btn.spinning { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 文档列表 */
.doc-list-scroll {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  padding: 10px; display: flex; flex-direction: column; gap: 10px;
}
.doc-list-empty { margin: auto; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8; }
.doc-item {
  border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; background: var(--panel); cursor: pointer;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.doc-item:hover { border-color: rgba(26,167,255,.5); }
.doc-item.selected {
  border-color: var(--brand);
  box-shadow: 0 0 0 1px var(--brand);
  background: rgba(26,167,255,.05);
}
.doc-title-row { display: flex; gap: 8px; align-items: flex-start; }
.doc-title { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; line-height: 1.4; word-break: break-all; }
.type-badge {
  flex: 0 0 auto; font-size: 11px; font-weight: 700;
  padding: 2px 9px; border-radius: 999px; border: 1px solid transparent;
}
.type-badge.pdf { color: var(--danger); background: rgba(231,76,60,.10); border-color: rgba(231,76,60,.35); }
.type-badge.markdown { color: var(--info); background: rgba(52,152,219,.10); border-color: rgba(52,152,219,.35); }
.type-badge.unknown { color: var(--muted); background: var(--panel-2); border-color: var(--border); }
.doc-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
.chunk-count { display: inline-flex; align-items: center; gap: 4px; }
.kw-chip {
  font-size: 11px; padding: 1px 8px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
}
details.abstract { margin-top: 8px; font-size: 12px; color: var(--muted); }
details.abstract summary { cursor: pointer; user-select: none; }
details.abstract p { margin: 6px 0 0; color: var(--text); line-height: 1.6; }
.doc-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 10px; }
.ghost-btn {
  font-size: 12px; padding: 4px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
  cursor: pointer; transition: color .15s, border-color .15s, background .15s;
}
.ghost-btn:hover { color: var(--text); border-color: rgba(26,167,255,.5); }
.ghost-btn.danger:hover { color: #fff; background: var(--danger); border-color: var(--danger); }

/* 列表底部：添加文档 */
.list-footer { flex: 0 0 auto; padding: 12px 14px; border-top: 1px solid var(--border); }
.add-doc-btn {
  width: 100%; padding: 12px; border: none; border-radius: 10px;
  background: linear-gradient(135deg, var(--brand), var(--brand2));
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  box-shadow: 0 6px 16px rgba(26,167,255,.25);
  transition: transform .15s, opacity .15s;
}
.add-doc-btn:hover { transform: translateY(-1px); }
.add-doc-btn:active { transform: translateY(0); }

/* ---- 导入视图（下层） ---- */
.import-body {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  padding: 14px; display: flex; flex-direction: column; gap: 14px;
}
.back-btn { display: inline-flex; align-items: center; gap: 6px; }
.upload-area {
  border: 2px dashed var(--info); border-radius: 8px;
  padding: 30px 20px; text-align: center; cursor: pointer;
  transition: background-color .2s;
}
.upload-area:hover { background-color: rgba(52,152,219,.08); }
.upload-icon { font-size: 40px; color: var(--info); margin-bottom: 8px; }
.upload-area p { margin: 0; }
.upload-area .sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
.file-list { display: flex; flex-direction: column; gap: 10px; }
.file-item {
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
}
.file-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.file-name { font-weight: 600; font-size: 13px; word-break: break-all; }
.file-size { font-size: 12px; color: var(--muted); margin-top: 3px; }
.status-badge {
  flex: 0 0 auto; padding: 4px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap;
}
.status-uploading { background-color: var(--warning); }
.status-processing { background-color: var(--info); }
.status-completed { background-color: var(--success); }
.status-error { background-color: var(--danger); }
.log-details { margin-top: 8px; font-size: 12px; color: var(--muted); }
.log-details summary { cursor: pointer; user-select: none; }
.log-list { margin: 6px 0 0 4px; padding: 0; list-style: none; }
.log-list li { margin: 3px 0; line-height: 1.5; color: var(--log-line); display: flex; gap: 6px; align-items: baseline; }
.log-ico { flex: 0 0 auto; width: 14px; text-align: center; }
.log-ico.done { color: var(--success); }
.log-ico.running { color: var(--info); }
.log-ico.failed { color: var(--danger); }

/* ---- 右半区：预览 ---- */
.preview-panel { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.preview-header {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px; border-bottom: 1px solid var(--border);
  background: var(--panel);
}
.preview-header .doc-title { font-size: 15px; }
.preview-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 18px 26px 30px; }
.preview-body-inner { max-width: 860px; margin: 0 auto; }
.preview-footer {
  flex: 0 0 auto;
  display: flex; justify-content: center; gap: 6px;
  padding: 10px; border-top: 1px solid var(--border); background: var(--panel);
}
.mode-btn {
  border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
  padding: 7px 18px; border-radius: 999px; font-size: 13px; cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.mode-btn.active {
  background: linear-gradient(135deg, var(--brand), var(--brand2));
  color: #fff; border-color: transparent;
}
.mode-btn:disabled { opacity: .5; cursor: not-allowed; }

/* 空态 */
.preview-empty {
  height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  color: var(--muted); text-align: center;
}
.preview-empty-icon { font-size: 44px; opacity: .7; }
.preview-empty-title { margin: 0; font-size: 15px; color: var(--text); }
.preview-empty-sub { margin: 0; font-size: 13px; }

/* 骨架屏 */
.skeleton { border-radius: 8px; background: linear-gradient(100deg, var(--panel-2) 30%, var(--border) 50%, var(--panel-2) 70%); background-size: 200% 100%; animation: shimmer 1.2s ease-in-out infinite; }
@keyframes shimmer { 0% { background-position: 120% 0; } 100% { background-position: -80% 0; } }
.sk-line { height: 14px; margin-bottom: 12px; }
.sk-line.w60 { width: 60%; }
.sk-line.w80 { width: 80%; }
.sk-line.w40 { width: 40%; }

/* markdown 渲染（对齐 global.css 的 .markdown 子集） */
.markdown { font-size: 15px; line-height: 1.7; overflow-wrap: break-word; }
.markdown > :first-child { margin-top: 0; }
.markdown h1, .markdown h2, .markdown h3, .markdown h4 { margin: 1em 0 .5em; font-weight: 600; line-height: 1.35; }
.markdown h1 { font-size: 1.4em; }
.markdown h2 { font-size: 1.25em; }
.markdown h3 { font-size: 1.1em; }
.markdown h4 { font-size: 1em; }
.markdown ul, .markdown ol { margin: .5em 0; padding-left: 1.5em; }
.markdown li { margin: .25em 0; }
.markdown blockquote {
  margin: .6em 0; padding: 2px 12px;
  border-left: 3px solid rgba(26,167,255,.5);
  background: var(--panel-2); border-radius: 0 8px 8px 0; color: var(--muted);
}
.markdown code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .85em; background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 5px; padding: .1em .35em;
}
.markdown pre {
  margin: .6em 0; padding: 12px 14px;
  background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 10px; overflow-x: auto;
}
.markdown pre code { background: none; border: none; padding: 0; white-space: pre; }
.markdown a { color: var(--brand); text-decoration: none; }
.markdown a:hover { text-decoration: underline; }
.markdown hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
.markdown table { border-collapse: collapse; margin: .6em 0; max-width: 100%; display: block; overflow-x: auto; }
.markdown th, .markdown td { border: 1px solid var(--border); padding: 6px 10px; font-size: .92em; }
.markdown th { background: var(--panel-2); font-weight: 600; }
.demo-img {
  display: inline-flex; flex-direction: column; gap: 2px; align-items: flex-start;
  border: 1px dashed var(--border); border-radius: 10px;
  background: var(--panel-2); color: var(--text);
  padding: 8px 12px; margin: 4px 0; font-size: 13px;
}
.demo-img small { font-size: 11px; color: var(--muted); word-break: break-all; }

/* chunks 卡片 */
.chunk-card {
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--panel); margin-bottom: 12px; overflow: hidden;
}
.chunk-head {
  display: flex; gap: 8px; align-items: center;
  padding: 8px 12px; background: var(--panel-2);
  border-bottom: 1px solid var(--border); font-size: 12px;
}
.chunk-idx {
  flex: 0 0 auto; padding: 1px 8px; border-radius: 999px;
  background: linear-gradient(135deg, var(--brand), var(--brand2));
  color: #fff; font-weight: 700;
}
.chunk-crumb { color: var(--muted); min-width: 0; word-break: break-all; }
.chunk-body { padding: 12px 14px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: break-word; }
.chunk-foot { padding: 2px 12px 8px; font-size: 11px; color: var(--muted); text-align: right; }

/* toast */
.toast-wrap { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
.toast {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 14px; box-shadow: var(--shadow); font-size: 13px; max-width: 340px;
  animation: toast-in .2s ease-out;
}
.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--danger); }
.toast.info { border-color: var(--info); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* 确认弹窗 */
.modal-mask {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(15, 20, 30, .45);
  display: flex; align-items: center; justify-content: center;
}
.modal-mask.hidden { display: none; }
.modal {
  width: 380px; max-width: calc(100vw - 40px);
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  padding: 20px; box-shadow: var(--shadow);
}
.modal h3 { margin: 0 0 10px; font-size: 16px; }
.modal .doc-title { display: block; margin: 4px 0 10px; }
.modal p { margin: 0 0 14px; font-size: 13px; color: var(--muted); line-height: 1.6; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.btn {
  padding: 8px 16px; border-radius: 9px; font-size: 13px; cursor: pointer;
  border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
}
.btn.primary { background: var(--danger); border-color: var(--danger); color: #fff; }

/* 响应式（demo 简化处理） */
@media (max-width: 900px) { .left-panel { flex-basis: 320px; width: 320px; } }
@media (max-width: 760px) {
  .docs-page { flex-direction: column; }
  .left-panel { flex: 0 0 46%; width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body>
<div class="app-shell">

  <!-- 顶部导航（对齐真实 NavBar，仅「文档管理」可用） -->
  <nav class="navbar">
    <div class="brand">
      <div class="logo"></div>
      <div class="title">
        <strong>智能本地知识库</strong>
        <span>对话与文档管理</span>
      </div>
    </div>
    <div class="tabs">
      <button class="tab" type="button"><span>💬</span>对话</button>
      <button class="tab active" type="button"><span>📚</span>文档管理</button>
    </div>
    <span class="demo-badge">demo · fake 数据</span>
    <button class="theme-toggle" id="themeToggle" type="button">🌙 深色</button>
  </nav>

  <!-- 文档管理页：左半区（列表 ⇄ 导入）+ 右半区（预览） -->
  <main class="docs-page">
    <aside class="left-panel">
      <div class="left-stage" id="leftStage">

        <!-- 下层：导入视图 -->
        <section class="view-import">
          <header class="panel-header">
            <button class="icon-btn back-btn" id="backToListBtn" type="button">← 文档列表</button>
            <h2>导入文档</h2>
          </header>
          <div class="import-body">
            <div class="upload-area" id="uploadArea">
              <div class="upload-icon">☁️</div>
              <p>点击或拖拽文件到此处 (PDF/MD)</p>
              <p class="sub">demo：点击将模拟一次上传任务（真实环境为选择本地文件）</p>
            </div>
            <div class="file-list" id="importFileList"></div>
          </div>
        </section>

        <!-- 上层：文档列表视图 -->
        <section class="view-list">
          <header class="panel-header">
            <h2>📚 文档列表</h2>
            <span class="count" id="docCount"></span>
            <button class="icon-btn" id="refreshBtn" type="button" title="手动刷新列表">🔄</button>
          </header>
          <div class="doc-list-scroll" id="docListScroll"></div>
          <footer class="list-footer">
            <button class="add-doc-btn" id="addDocBtn" type="button">＋ 添加文档</button>
          </footer>
        </section>

      </div>
    </aside>

    <!-- 右半区：预览 -->
    <section class="preview-panel">
      <header class="preview-header" id="previewHeader"></header>
      <div class="preview-body" id="previewBody">
        <div class="preview-empty" id="previewEmpty">
          <div class="preview-empty-icon">📄</div>
          <p class="preview-empty-title">在左侧选择一篇文档</p>
          <p class="preview-empty-sub">选中后将在此渲染文档的 Markdown，底部可切换 Chunks 分段视图</p>
        </div>
      </div>
      <footer class="preview-footer">
        <button class="mode-btn active" id="modeMarkdownBtn" type="button" disabled>Markdown</button>
        <button class="mode-btn" id="modeChunksBtn" type="button" disabled>Chunks</button>
      </footer>
    </section>
  </main>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-mask hidden" id="modalMask">
  <div class="modal">
    <h3>删除文档？</h3>
    <span class="doc-title" id="modalDocTitle"></span>
    <p>删除后该文档的 Milvus 索引（docs / chunks）与 MinIO 制品（原始文件 / markdown / chunks.json）将被一并移除，<b>不可恢复</b>。</p>
    <div class="modal-actions">
      <button class="btn" id="modalCancelBtn" type="button">取消</button>
      <button class="btn primary" id="modalOkBtn" type="button">确认删除</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

/* ═══════════════════════════════════════════════════════════════
 * 模拟后端切分：按标题切分 markdown（简化移植 src/utils/markdown_splitter.py）
 * ═══════════════════════════════════════════════════════════════ */
function fakeSplitByTitle(md) {
  const chunks = [];
  const lines = md.split(/\r?\n/);
  const titleRe = /^(#{1,6})\s+(.*)$/;
  let titleStack = [];
  let level = 0;
  let contentLines = [];
  const flush = () => {
    const content = contentLines.join("\n").trim();
    if (content) chunks.push({ content, level, title_stack: [...titleStack] });
  };
  for (const line of lines) {
    if (!line.trim()) { contentLines.push(line); continue; }
    const m = titleRe.exec(line);
    if (m) {
      flush();
      contentLines = [];
      level = m[1].length;
      const text = m[2];
      while (titleStack.length < level) titleStack.push(null);
      titleStack[level - 1] = text;
      titleStack.length = level;
    } else {
      contentLines.push(line);
    }
  }
  flush();
  return chunks;
}

/* ═══════════════════════════════════════════════════════════════
 * 迷你 markdown 渲染器（demo 用，真实实现复用 react-markdown）
 * ═══════════════════════════════════════════════════════════════ */
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function inlineMd(s) {
  let out = escapeHtml(s);
  // 图片：demo 不加载真实资源，渲染为占位框（真实实现经后端代理重写，见方案设计 §4.4）
  out = out.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_m, alt, url) => {
    const name = decodeURIComponent(url.split("/").pop() || url);
    return `<span class="demo-img">📷 ${escapeHtml(alt || name)}<small>minio://markdown-images/…/${escapeHtml(name)}</small></span>`;
  });
  out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return out;
}
function splitTableRow(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((s) => s.trim());
}
function renderMarkdown(src) {
  const lines = src.split(/\r?\n/);
  const html = [];
  const fenceRe = /^\s*(`{3,}|~{3,})/;
  const isTableStart = (i) =>
    lines[i].includes("|") &&
    i + 1 < lines.length &&
    /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) &&
    lines[i + 1].includes("-");
  const startsBlock = (i) => {
    const l = lines[i];
    return (
      /^\s*(#{1,6}\s|>|[-*+]\s|\d+[.)]\s)/.test(l) ||
      fenceRe.test(l) ||
      isTableStart(i) ||
      /^\s*(-{3,}|\*{3,})\s*$/.test(l)
    );
  };

  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (fenceRe.test(line)) {                                  /* 代码块 */
      const fence = line.trim().charAt(0);
      const buf = [];
      i++;
      while (i < lines.length && !new RegExp("^\\s*" + fence + "{3,}").test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      html.push(`<pre><code>${escapeHtml(buf.join("\n"))}</code></pre>`);
      continue;
    }
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) {                                                    /* 标题 */
      const n = h[1].length;
      html.push(`<h${n}>${inlineMd(h[2])}</h${n}>`);
      i++;
      continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { html.push("<hr>"); i++; continue; }
    if (/^\s*>/.test(line)) {                                   /* 引用 */
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      html.push(`<blockquote>${inlineMd(buf.join(" "))}</blockquote>`);
      continue;
    }
    if (isTableStart(i)) {                                      /* 表格 */
      const head = splitTableRow(lines[i]);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|")) { rows.push(splitTableRow(lines[i])); i++; }
      html.push(
        "<table><thead><tr>" + head.map((c) => `<th>${inlineMd(c)}</th>`).join("") + "</tr></thead><tbody>" +
        rows.map((r) => "<tr>" + r.map((c) => `<td>${inlineMd(c)}</td>`).join("") + "</tr>").join("") +
        "</tbody></table>"
      );
      continue;
    }
    if (/^\s*[-*+]\s+/.test(line)) {                            /* 无序列表 */
      const buf = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*[-*+]\s+/, "")); i++; }
      html.push("<ul>" + buf.map((x) => `<li>${inlineMd(x)}</li>`).join("") + "</ul>");
      continue;
    }
    if (/^\s*\d+[.)]\s+/.test(line)) {                          /* 有序列表 */
      const buf = [];
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*\d+[.)]\s+/, "")); i++; }
      html.push("<ol>" + buf.map((x) => `<li>${inlineMd(x)}</li>`).join("") + "</ol>");
      continue;
    }
    if (!line.trim()) { i++; continue; }
    const buf = [];                                             /* 段落 */
    while (i < lines.length && lines[i].trim() && !startsBlock(i)) { buf.push(lines[i]); i++; }
    html.push(`<p>${inlineMd(buf.join(" "))}</p>`);
  }
  return html.join("\n");
}

function renderDocList() {

        <span class="type-badge ${doc.file_type}">${typeLabel}</span>

function selectDoc(docId) {
  const doc = findDoc(docId);
  if (!doc) return;
  state.selectedId = docId;
  state.previewMode = "markdown";            // 新选中默认 Markdown 视图
  renderDocList();
  renderPreviewHeader(doc);
  modeMarkdownBtn.disabled = false;
  modeChunksBtn.disabled = false;
  setModeActive();
  showSkeleton();
  if (state.previewTimer) clearTimeout(state.previewTimer);
  state.previewTimer = setTimeout(() => renderPreviewContent(doc), 500);  // 模拟 fetch 延迟
}

function renderPreviewHeader(doc) {
  const typeLabel = doc.file_type === "pdf" ? "PDF" : doc.file_type === "markdown" ? "Markdown" : "未知类型";
  previewHeader.innerHTML = `
    <span class="doc-title">${escapeHtml(doc.file_title)}</span>
    <span class="type-badge ${doc.file_type}">${typeLabel}</span>
    <span class="count">🧩 ${doc.chunks.length} chunks</span>`;
}

function showSkeleton() {
  previewBody.innerHTML = `<div class="preview-body-inner">
    <div class="skeleton sk-line w60"></div>
    <div class="skeleton sk-line"></div>
    <div class="skeleton sk-line"></div>
    <div class="skeleton sk-line w80"></div>
    <div class="skeleton sk-line w40"></div>
  </div>`;
}

function renderPreviewContent(doc) {
  const inner = document.createElement("div");
  inner.className = "preview-body-inner";
  if (state.previewMode === "markdown") {
    const wrap = document.createElement("div");
    wrap.className = "markdown";
    wrap.innerHTML = renderMarkdown(doc.markdown);
    inner.appendChild(wrap);
  } else {
    doc.chunks.forEach((chunk, idx) => {
      const card = document.createElement("div");
      card.className = "chunk-card";
      const crumb = (chunk.title_stack || []).filter(Boolean).join(" › ") || "(无标题)";
      card.innerHTML = `
        <div class="chunk-head">
          <span class="chunk-idx">#${idx + 1}</span>
          <span class="chunk-crumb">${escapeHtml(crumb)}</span>
        </div>
        <div class="chunk-body"></div>
        <div class="chunk-foot">${chunk.content.length.toLocaleString()} 字符</div>`;
      card.querySelector(".chunk-body").textContent = chunk.content;
      inner.appendChild(card);
    });
  }
  previewBody.innerHTML = "";
  previewBody.appendChild(inner);
}

function setModeActive() {
  modeMarkdownBtn.classList.toggle("active", state.previewMode === "markdown");
  modeChunksBtn.classList.toggle("active", state.previewMode === "chunks");
}

function resetPreview() {
  state.selectedId = null;
  state.previewMode = "markdown";
  modeMarkdownBtn.disabled = true;
  modeChunksBtn.disabled = true;
  setModeActive();
  previewHeader.innerHTML = "";
  previewBody.innerHTML = "";
  previewBody.appendChild(previewEmpty);
  if (state.previewTimer) { clearTimeout(state.previewTimer); state.previewTimer = null; }
}

function openDeleteModal(doc) {
  state.deletingId = doc.doc_id;
  modalDocTitle.textContent = `《${doc.file_title}》`;
  modalMask.classList.remove("hidden");

function confirmDelete() {
  const docId = state.deletingId;
  state.deletingId = null;
  modalMask.classList.add("hidden");
  const doc = findDoc(docId);
  state.docs = state.docs.filter((d) => d.doc_id !== docId);
  if (state.selectedId === docId) resetPreview();
  renderDocList();
  toast(`已删除《${doc.file_title}》（demo：真实环境将级联删除 Milvus docs/chunks 与 MinIO 三份制品）`, "success");
}

/* ═══════════════════════════════════════════════════════════════
 * Chunks Json：新标签页查看（demo 用 Blob URL 模拟）
 * ═══════════════════════════════════════════════════════════════ */
function openChunksJson(doc) {
  const blob = new Blob([JSON.stringify(doc.chunks, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  window.open(url, "_blank");
  toast(`demo：真实环境将新标签页打开 GET /api/docs/${doc.doc_id}/artifact?kind=chunks`, "info");
}

/* ═══════════════════════════════════════════════════════════════
 * 卷帘门：列表 ⇄ 导入（方案设计 §5.4）
 * ═══════════════════════════════════════════════════════════════ */
function setView(view) {
  leftStage.classList.toggle("importing", view === "import");
  if (view === "import") seedImportTasks();
}

/* ═══════════════════════════════════════════════════════════════
 * 导入视图：模拟上传任务（真实实现为 upload + 轮询，逻辑平移自现 ImportPage）
 * ═══════════════════════════════════════════════════════════════ */
const FAKE_TASKS = [
  { name: "产品手册-新版本.pdf", sizeKB: "1.24 MB", steps: ["上传文件", "PDF 解析 (MinerU)", "图片识别 (VLM)", "文档切分与向量化"], failAt: null },
  { name: "旧版说明.md", sizeKB: "38.2 KB", steps: ["上传文件", "文档切分", "关键词/摘要生成", "文档切分与向量化"], failAt: "文档切分与向量化" },
];
const STATUS_LABELS = { uploading: "上传中...", processing: "处理中...", completed: "已完成", error: "失败" };

function seedImportTasks() {
  if (state.importSeeded) return;
  state.importSeeded = true;
  FAKE_TASKS.forEach((task, taskIdx) => {
    const item = createUploadItem(task);
    importFileList.appendChild(item);
    runUploadSimulation(item, task, taskIdx);
  });
}

function createUploadItem(task) {
  const item = document.createElement("div");
  item.className = "file-item";
  item.innerHTML = `
    <div class="file-info">
      <span class="file-name">${escapeHtml(task.name)}</span>
      <span class="file-size">${task.sizeKB}</span>
      <details class="log-details" open>
        <summary>已耗时 0.0s，点击收起 / 展开</summary>
        <ul class="log-list"></ul>
      </details>
    </div>
    <div class="status-badge status-uploading">${STATUS_LABELS.uploading}</div>`;
  return item;
}

/* 依次推进步骤状态，模拟「上传 → 处理 → 完成/失败」+ 每 500ms 刷新耗时 */
function runUploadSimulation(item, task, taskIdx) {
  const startedAt = Date.now();
  const badge = item.querySelector(".status-badge");
  const summary = item.querySelector("summary");
  const logList = item.querySelector(".log-list");
  const tick = setInterval(() => {
    summary.textContent = `已耗时 ${((Date.now() - startedAt) / 1000).toFixed(1)}s，点击收起 / 展开`;
  }, 500);

  let step = 0;
  let done = 0;
  const advance = () => {
    if (step < task.steps.length) {
      badge.textContent = STATUS_LABELS[step === 0 ? "uploading" : "processing"];
      badge.className = "status-badge " + (step === 0 ? "status-uploading" : "status-processing");
      const label = task.steps[step];
      if (step === 0) done = 1;                       // 「上传文件」直接完成
      renderLogLines(logList, task.steps.slice(0, done), [label], []);
      step++;
      setTimeout(advance, 1000 + Math.random() * 600);
      return;
    }
    /* 全部步骤跑完 → 成功 / 失败 */
    clearInterval(tick);
    summary.textContent = `已耗时 ${((Date.now() - startedAt) / 1000).toFixed(1)}s，点击收起 / 展开`;
    if (task.failAt) {
      badge.textContent = STATUS_LABELS.error;
      badge.className = "status-badge status-error";
      renderLogLines(logList, task.steps, [], [task.failAt]);
      toast(`导入失败：${task.name}（demo 模拟「${task.failAt}」节点失败）`, "error", 5000);
    } else {
      badge.textContent = STATUS_LABELS.completed;
      badge.className = "status-badge status-completed";
      renderLogLines(logList, task.steps, [], []);
      toast(`导入完成：${task.name}`, "success");
      autoRefreshAfterImport(taskIdx);
    }
  };
  setTimeout(advance, 800);
}

function renderLogLines(logList, doneList, runningList, failedList) {
  const line = (kind, text) => {
    const ico = kind === "done" ? "✓" : kind === "running" ? "⏳" : "✗";
    return `<li><span class="log-ico ${kind}">${ico}</span><span>${escapeHtml(text)}</span></li>`;
  };
  logList.innerHTML =
    doneList.map((t) => line("done", t)).join("") +
    failedList.map((t) => line("failed", t)).join("") +
    runningList.map((t) => line("running", t)).join("");
}

/* 点击上传区 → 追加一个模拟任务（成功路径） */
function addFakeUpload() {
  const task = { name: `演示文档-${Date.now() % 1000}.pdf`, sizeKB: "512.0 KB", steps: ["上传文件", "PDF 解析 (MinerU)", "文档切分与向量化"], failAt: null };
  const item = createUploadItem(task);
  importFileList.prepend(item);
  runUploadSimulation(item, task, 99);
}

/* 导入完成 → 列表自动刷新（决策 D5：后台刷新，不强制切回列表视图） */
function autoRefreshAfterImport(_taskIdx) {
  if (findDoc(FAKE_NEW_DOC.doc_id)) return;             // 已刷新过
  const newDoc = { ...FAKE_NEW_DOC };
  newDoc.chunks = fakeSplitByTitle(newDoc.markdown);
  state.docs = [newDoc, ...state.docs];                // 新文档置顶（doc_id 倒序）
  renderDocList();
  toast("文档列表已自动刷新（决策 D5：导入完成 → 后台刷新）", "success");
}

/* ═══════════════════════════════════════════════════════════════
 * 事件绑定
 * ═══════════════════════════════════════════════════════════════ */
$("#addDocBtn").addEventListener("click", () => setView("import"));
$("#backToListBtn").addEventListener("click", () => setView("list"));
$("#uploadArea").addEventListener("click", addFakeUpload);
$("#refreshBtn").addEventListener("click", () => {
  const btn = $("#refreshBtn");
  btn.classList.add("spinning");
  setTimeout(() => {
    btn.classList.remove("spinning");
    renderDocList();
    toast("列表已刷新（demo：真实环境为重新 GET /api/docs）", "success");
  }, 600);
});
modeMarkdownBtn.addEventListener("click", () => {
  if (!state.selectedId || state.previewMode === "markdown") return;
  state.previewMode = "markdown";
  setModeActive();
  showSkeleton();
  if (state.previewTimer) clearTimeout(state.previewTimer);
  state.previewTimer = setTimeout(() => renderPreviewContent(findDoc(state.selectedId)), 300);
});
modeChunksBtn.addEventListener("click", () => {
  if (!state.selectedId || state.previewMode === "chunks") return;
  state.previewMode = "chunks";
  setModeActive();
  showSkeleton();
  if (state.previewTimer) clearTimeout(state.previewTimer);
  state.previewTimer = setTimeout(() => renderPreviewContent(findDoc(state.selectedId)), 300);
});
$("#modalCancelBtn").addEventListener("click", () => {
  state.deletingId = null;
  modalMask.classList.add("hidden");
});
$("#modalOkBtn").addEventListener("click", confirmDelete);

/* 主题切换（对齐 ThemeContext 的 light/dark） */
const themeToggle = $("#themeToggle");
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  themeToggle.textContent = theme === "dark" ? "☀️ 浅色" : "🌙 深色";
  localStorage.setItem("docs_demo_theme", theme);
}
applyTheme(
  localStorage.getItem("docs_demo_theme") ||
  (window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "dark" : "light")
);
themeToggle.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  applyTheme(next);
});

/* 初始渲染：列表就绪，右半区为空态（PRD：刚开始右半区为空，提示在左侧选择文档） */
renderDocList();
resetPreview();
</script>
