<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <!--
      Markdown Chunks Viewer —— 单文件工具, 双击打开即可 (file:// 也能用), 无后端、无网络请求。

      生成数据:  PYTHONPATH=backend python -m common.utils.markdown_splitter     # -> var/tmp/chunks.json
      载入数据:  把 var/tmp/chunks.json 拖进窗口, 或点右上角「打开 JSON」

      三种视图:  merge = 按 level / title_stack 把 chunks 拼回全文
                split = 每个 chunk 一张卡片 + 切分边界
                meta  = 原始 JSON 逐条查看
      左侧长度条随滚动高亮当前 chunk; 重新生成数据后再拖一次文件即可刷新。
    -->
    <title>Markdown Chunks Viewer · chunks.json 查看器</title>

    <!--
    marked (Markdown 渲染)。用 async 加载: 即使 CDN 不可用/很慢也不会阻塞页面,
    页面会先用纯文本渲染, marked 到位后再自动重渲染一次。
  -->
    <script
      src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
      async
      onload="window.__onMarkedReady && window.__onMarkedReady()"
    ></script>

    <style>
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --panel-2: #fafbfc;
  --border: #e4e6eb;
  --border-strong: #d3d7dd;
  --text: #1f2328;
  --muted: #6b7280;
  --accent: #4f46e5;
  --accent-weak: #eef2ff;
  --danger: #dc2626;
  --ok: #16a34a;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --topbar-h: 56px;
  --radius: 12px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  font-family: var(--sans);
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
}

/* ===================== TOP BAR ===================== */
.topbar {
  flex: 0 0 auto;
  /* 窄窗口时换行, 保证 Reload 按钮不会被挤出可视区 */
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 16px;
  min-height: var(--topbar-h);
  padding: 8px 18px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 650;
  font-size: 15px;
  letter-spacing: -0.01em;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: #fff;
  font-size: 15px;
}

/* data source readout */
.source-info {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-right: auto;
  min-width: 0;
  font-size: 12px;
  color: var(--muted);
}

.src-label {
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #a3a8b0;
}

.source-info code {
  font-family: var(--mono);
  font-size: 12px;
  background: var(--accent-weak);
  color: var(--accent);
  padding: 2px 7px;
  border-radius: 6px;
}

.src-meta {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}

/* ===================== 内容宽度控制 ===================== */
.width-control {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 8px 3px 10px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 10px;
}

.width-label {
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #a3a8b0;
}

#widthRange {
  width: 108px;
  height: 16px;
  accent-color: var(--accent);
  cursor: pointer;
}

.width-value {
  min-width: 42px;
  padding: 3px 6px;
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 650;
  color: var(--accent);
  background: var(--accent-weak);
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background .15s;
}

.width-value:hover { background: #e0e7ff; }

/* ===================== SEGMENTED SWITCH ===================== */
.segmented {
  position: relative;
  display: inline-flex;
  align-items: center;
  background: #eceef1;
  border-radius: 10px;
  padding: 3px;
  gap: 2px;
  transition: opacity .2s;
}

.seg-thumb {
  position: absolute;
  top: 3px;
  bottom: 3px;
  left: 0;
  width: 0;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(15, 23, 42, 0.04);
  transition: transform .22s cubic-bezier(.4, 0, .2, 1), width .22s cubic-bezier(.4, 0, .2, 1);
}

.seg-btn {
  position: relative;
  z-index: 1;
  border: none;
  background: transparent;
  padding: 6px 14px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 550;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  border-radius: 8px;
  transition: color .18s;
}

.seg-btn:hover { color: var(--text); }
.seg-btn.active { color: var(--text); }

/* ===================== BUTTONS ===================== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid transparent;
  border-radius: 9px;
  padding: 7px 14px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, transform .05s, opacity .15s;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.55; cursor: default; }

.btn.primary {
  background: var(--accent);
  color: #fff;
}
.btn.primary:hover:not(:disabled) { background: #4338ca; }

/* ===================== MAIN ===================== */
main {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
}

.pane {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
}

.preview-pane { background: var(--bg); }

.preview-scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 22px 28px 60px;
}

/* ===================== 左侧 chunk 长度条 ===================== */
.chunk-rail {
  flex: 0 0 auto;
  width: 118px;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px 12px 40px 14px;
  background: var(--panel-2);
  border-right: 1px solid var(--border);
  scrollbar-width: thin;
}

/* 用 class 控制显示, 否则 display:flex 会盖掉 [hidden] 的 UA 样式 */
.chunk-rail[hidden] { display: none; }

.rail-caption {
  position: sticky;
  top: 0;
  z-index: 1;
  padding-bottom: 6px;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #a3a8b0;
  background: var(--panel-2);
}

.rail-bars {
  display: flex;
  flex-direction: column;
  align-items: flex-start;   /* 所有 bar 左对齐 */
  gap: 4px;
}

/* 单根 bar: 宽度由 JS 按 chunk 长度写成百分比, 向右延长 */
.rail-bar {
  display: block;
  height: 9px;
  min-width: 4px;
  padding: 0;
  border: none;
  border-radius: 3px;
  background: #d3d7dd;
  cursor: pointer;
  transition: background .15s;
}

.rail-bar:hover { background: #9aa0a8; }

/* 当前滚动到的 chunk */
.rail-bar.active {
  background: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-weak);
}

.rail-bar:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* 悬停时显示的 chunk size 气泡 (fixed, 不会被 rail 的滚动裁掉) */
.rail-tip {
  position: fixed;
  z-index: 60;
  padding: 5px 9px;
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.3;
  color: #fff;
  background: rgba(31, 35, 40, 0.92);
  border-radius: 7px;
  white-space: nowrap;
  pointer-events: none;      /* 别挡住鼠标, 否则会闪 */
  transform: translateY(-50%);
}

.rail-tip[hidden] { display: none; }

/* 所有视图都渲染在这条按 --content-width 限宽并居中的列里 */
.content-column {
  width: var(--content-width, 50%);
  /* 窄到 20% 时也不至于挤成一列文字, 同时不会撑出横向滚动 */
  min-width: min(320px, 100%);
  max-width: 100%;
  margin: 0 auto;
}

/* ===================== CHUNK CARDS (split view) ===================== */
.chunk-card {
  border: 1.5px solid var(--border-strong);
  border-radius: var(--radius);
  background: #fff;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  overflow: hidden;
}

.chunk-card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 14px;
  background: var(--panel-2);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted);
}

.chunk-badge {
  background: var(--accent-weak);
  color: var(--accent);
  font-weight: 650;
  font-size: 11px;
  padding: 2px 9px;
  border-radius: 999px;
  letter-spacing: 0.01em;
}

.chunk-title-stack {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--text);
  font-weight: 550;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chunk-level {
  flex: 0 0 auto;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 650;
  color: #7c3aed;
  background: #f3e8ff;
  padding: 2px 7px;
  border-radius: 6px;
}

.chunk-size-note {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 11px;
  color: #9aa0a8;
}

.chunk-card-body {
  padding: 14px 20px;
}

/* split boundary marker between chunks */
.split-marker {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 10px 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.02em;
}
.split-marker::before,
.split-marker::after {
  content: "";
  flex: 1;
  border-top: 1.5px dashed #cfd4db;
}
.split-marker .scissors { color: var(--accent); }

/* ===================== DROP ZONE ===================== */
.dropzone {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: 100%;
  max-width: 620px;
  margin: 7vh auto 0;
  padding: 46px 28px;
  font-family: var(--sans);
  color: var(--muted);
  text-align: center;
  background: var(--panel);
  border: 2px dashed var(--border-strong);
  border-radius: 16px;
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .08s;
}

.dropzone:hover {
  border-color: var(--accent);
  background: #fff;
}

.dropzone:active { transform: translateY(1px); }

.drop-icon,
.dropzone-icon {
  font-size: 30px;
  line-height: 1;
  color: var(--accent);
}

.dropzone-title {
  font-size: 16px;
  font-weight: 650;
  color: var(--text);
}

.dropzone-sub { font-size: 13px; }

.dropzone-hint {
  margin-top: 10px;
  font-size: 12px;
  color: #9aa0a8;
}

.dropzone-hint code,
.empty-state code,
.drop-overlay code {
  font-family: var(--mono);
  font-size: 12px;
  background: var(--accent-weak);
  color: var(--accent);
  padding: 1px 5px;
  border-radius: 5px;
}

/* 拖拽悬停整窗口时的提示层 */
.drop-overlay {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(79, 70, 229, 0.10);
  backdrop-filter: blur(1.5px);
  z-index: 50;
  pointer-events: none;   /* 让 drop 事件仍落在 window 上 */
}

body.dragging .drop-overlay { display: flex; }

.drop-overlay-inner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px 30px;
  font-size: 16px;
  font-weight: 650;
  color: var(--accent);
  background: #fff;
  border: 2px dashed var(--accent);
  border-radius: 14px;
  box-shadow: 0 12px 32px rgba(15, 23, 42, 0.14);
}

/* ===================== EMPTY / ERROR STATE ===================== */
.empty-state {
  margin: 8vh auto 0;
  max-width: 760px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  padding: 24px;
  line-height: 1.7;
}

/* ===================== META (JSON) VIEW ===================== */
.meta-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.meta-bar .btn.primary { margin-left: auto; }

.meta-count {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}

.meta-card {
  border: 1.5px solid var(--border-strong);
  border-radius: var(--radius);
  background: #fff;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  overflow: hidden;          /* 让代码块的底色贴合圆角 */
  margin-bottom: 12px;
}

.meta-card:last-child { margin-bottom: 0; }

.meta-card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 6px 14px;
  background: var(--panel-2);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted);
}

.meta-card-head .chunk-title-stack { min-width: 0; }

/* head 里的 size 提示: 承接 .chunk-size-note 的 margin-left:auto, 把按钮一起推到右边 */
.meta-card-head .chunk-size-note { flex: 0 0 auto; }

/* 每个元素一个「复制这个元素」按钮 */
.meta-copy {
  margin-left: 0;
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.4;
  color: var(--muted);
  background: #fff;
  border: 1px solid var(--border-strong);
  border-radius: 7px;
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}

.meta-copy:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-weak);
}

.meta-json {
  margin: 0;
  padding: 14px 16px;
  background: #0d1117;
  color: #e6edf3;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.55;
  /* 超出显示宽度时自动换行, 不再出现横向滚动条 */
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
  tab-size: 2;
}

/* ===================== MARKDOWN BODY TYPOGRAPHY ===================== */
.markdown-body { line-height: 1.65; font-size: 14.5px; word-wrap: break-word; }
.markdown-body > :first-child { margin-top: 0; }
.markdown-body > :last-child { margin-bottom: 0; }
.markdown-body h1, .markdown-body h2, .markdown-body h3,
.markdown-body h4, .markdown-body h5, .markdown-body h6 {
  line-height: 1.3;
  margin: 1.2em 0 0.5em;
  font-weight: 650;
}
.markdown-body h1 { font-size: 1.7em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
.markdown-body h2 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: .25em; }
.markdown-body h3 { font-size: 1.2em; }
.markdown-body p { margin: 0.6em 0; }
.markdown-body a { color: var(--accent); }
.markdown-body code {
  font-family: var(--mono);
  font-size: 0.88em;
  background: #f0f1f4;
  padding: 0.15em 0.4em;
  border-radius: 5px;
}
.markdown-body pre {
  background: #0d1117;
  color: #e6edf3;
  padding: 14px 16px;
  border-radius: 9px;
  overflow-x: auto;
  line-height: 1.5;
}
.markdown-body pre code { background: none; padding: 0; color: inherit; font-size: 13px; }
.markdown-body ul, .markdown-body ol { padding-left: 1.6em; margin: 0.6em 0; }
.markdown-body li { margin: 0.25em 0; }
.markdown-body blockquote {
  margin: 0.8em 0;
  padding: 0.2em 1em;
  border-left: 4px solid var(--accent);
  color: var(--muted);
  background: var(--accent-weak);
  border-radius: 0 8px 8px 0;
}
.markdown-body table { border-collapse: collapse; margin: 0.8em 0; width: 100%; }
.markdown-body th, .markdown-body td {
  border: 1px solid var(--border-strong);
  padding: 6px 12px;
  text-align: left;
}
.markdown-body th { background: var(--panel-2); font-weight: 600; }
.markdown-body hr { border: none; border-top: 1px solid var(--border-strong); margin: 1.2em 0; }

/* marked 不可用时的纯文本兜底 */
.md-plain {
  margin: 0;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text);
}

/* ===================== RESPONSIVE ===================== */
@media (max-width: 720px) {
  .brand-name { display: none; }
  .width-label { display: none; }
  #widthRange { width: 74px; }
  .preview-scroll { padding: 16px 14px 48px; }
  .chunk-card-body { padding: 12px 14px; }
  /* 窄屏优先保证正文可读, 长度条让位 */
  .chunk-rail { display: none; }
  .rail-tip { display: none; }
}
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◫</span>
        <span class="brand-name">Markdown&nbsp;Chunks&nbsp;Viewer</span>
      </div>

      <div class="source-info">
        <span class="src-label">file</span>
        <code id="srcPath">未载入</code>
        <span id="srcMeta" class="src-meta">拖入 chunks.json</span>
      </div>

      <div class="controls">
        <!-- 内容显示宽度: 相对窗口宽度的百分比, 默认 50% -->
        <div
          class="width-control"
          title="内容显示宽度 (相对窗口宽度), 默认 50%"
        >
          <span class="width-label">width</span>
          <input
            id="widthRange"
            type="range"
            min="20"
            max="100"
            step="1"
            value="50"
            aria-label="内容显示宽度百分比"
          />
          <button
            id="widthValue"
            class="width-value"
            type="button"
            title="点击恢复默认 50%"
          >
            50%
          </button>
        </div>

        <!-- Display mode: merge / split / meta -->
        <div
          class="segmented"
          id="modeSwitch"
          role="group"
          aria-label="Display mode"
        >
          <div class="seg-thumb"></div>
          <button
            class="seg-btn active"
            data-value="merge"
            type="button"
            title="按标题把 chunks 拼回整篇文档"
          >
            merge
          </button>
          <button
            class="seg-btn"
            data-value="split"
            type="button"
            title="每个 chunk 一张卡片, 含长度与切分标记"
          >
            split
          </button>
          <button
            class="seg-btn"
            data-value="meta"
            type="button"
            title="原始 JSON, 逐条代码卡片"
          >
            meta
          </button>
        </div>

        <button
          id="openBtn"
          class="btn primary"
          type="button"
          title="选择 chunks.json"
        >
          <span class="btn-icon">⤓</span> 打开 JSON
        </button>
        <input
          id="fileInput"
          type="file"
          accept=".json,application/json"
          hidden
        />
      </div>
    </header>

    <main>
      <!-- 左侧 chunk 长度条: 每个 chunk 一根, 左对齐向右延长 -->
      <aside
        id="chunkRail"
        class="chunk-rail"
        aria-label="Chunk 长度分布"
        hidden
      ></aside>

      <div class="pane preview-pane">
        <div id="preview" class="preview-scroll"></div>
      </div>
    </main>

    <!-- 悬停 bar 时跟随显示的 chunk size 提示 -->
    <div id="railTip" class="rail-tip" role="tooltip" hidden></div>

    <!-- 把文件拖到窗口任意位置时出现 -->
    <div id="dropOverlay" class="drop-overlay" aria-hidden="true">
      <div class="drop-overlay-inner">
        <span class="drop-icon">⤓</span>
        <span>松开鼠标载入 JSON</span>
      </div>
    </div>

    <script>
'use strict';

/*
 * Markdown Chunks Viewer · 单文件查看器
 *
 * 不发任何网络请求, 也不执行 Python。数据完全来自你拖进来的 JSON 文件:
 *
 *   1) 命令行生成数据:
 *        PYTHONPATH=backend python -m common.utils.markdown_splitter     # -> var/tmp/chunks.json
 *
 *   2) 直接双击 tools/markdown_chunks_viewer.html (file:// 也能用),
 *      把 var/tmp/chunks.json 拖进窗口 —— 或者点右上角「打开 JSON」选择文件。
 *
 * 三种视图 (数据都来自这份 JSON):
 *   merge  — 按 level / title_stack 把 chunks 重新拼回完整文档
 *   split  — 每个 chunk 一张卡片 + 切分边界
 *   meta   — 原始 JSON, 每个元素一张代码卡片
 * 重新生成数据后再拖一次文件即可刷新。
 *
 * 左侧还有一条 chunk 长度条: 一根 bar 对应一个 chunk, 滚动时高亮当前 chunk,
 * 悬停显示大小, 点击跳到对应位置。
 */

/* ======================= DOM refs ======================= */
const $ = (sel) => document.querySelector(sel);

const modeSwitch = $('#modeSwitch');
const preview = $('#preview');
const chunkRail = $('#chunkRail');
const railTip = $('#railTip');
const srcPath = $('#srcPath');
const srcMeta = $('#srcMeta');
const openBtn = $('#openBtn');
const fileInput = $('#fileInput');
const dropOverlay = $('#dropOverlay');
const widthRange = $('#widthRange');
const widthValue = $('#widthValue');

/* 内容显示宽度: 相对窗口宽度的百分比 */
const WIDTH_KEY = 'markdown-chunks-viewer:content-width';
const WIDTH_MIN = 20;
const WIDTH_MAX = 100;
const WIDTH_DEFAULT = 50;

/* ======================= State ======================= */
const state = {
  mode: 'merge',      // 'merge' | 'split' | 'meta'
  chunks: null,       // Chunk[] | null
  file: null,         // {name, size} | null
  error: null,
  loadedAt: null,
  dragging: false,
};

/* ======================= helpers ======================= */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatSize(bytes) {
  if (typeof bytes !== 'number' || Number.isNaN(bytes)) return '';
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

// 字符串按 UTF-8 编码后的字节数 (中文一个字算 3 字节)
function byteLength(text) {
  try {
    return new Blob([text]).size;
  } catch {
    return text.length;
  }
}

function clockTime(date) {
  if (!date) return '';
  return date.toLocaleTimeString('zh-CN', { hour12: false });
}

// 没有 CDN (marked 未加载) 时退化成纯文本, 页面依然可用
function renderMarkdown(text) {
  if (window.marked && typeof window.marked.parse === 'function') {
    try {
      return marked.parse(text);
    } catch {
      /* fall through */
    }
  }
  return `<pre class="md-plain">${escapeHtml(text)}</pre>`;
}

/* ======================= 显示宽度 ======================= */
function applyWidth(pct, { persist = true } = {}) {
  const n = Number(pct);
  const value = Math.min(WIDTH_MAX, Math.max(WIDTH_MIN, Number.isFinite(n) ? Math.round(n) : WIDTH_DEFAULT));
  document.documentElement.style.setProperty('--content-width', `${value}%`);
  widthRange.value = String(value);
  widthValue.textContent = `${value}%`;
  if (persist) {
    try {
      localStorage.setItem(WIDTH_KEY, String(value));
    } catch {
      /* file:// 或隐私模式下可能不可用, 忽略 */
    }
  }
  return value;
}

function initialWidth() {
  try {
    const saved = localStorage.getItem(WIDTH_KEY);
    if (saved != null) return Number(saved);
  } catch {
    /* ignore */
  }
  return WIDTH_DEFAULT;
}

// 所有视图的输出都放进这个「按宽度居中」的列里
function setContent(html) {
  preview.innerHTML = `<div class="content-column">${html}</div>`;
}

/* ======================= 左侧 chunk 长度条 =======================
 * 每个 chunk 一根 bar, 从上到下按顺序排列, 左对齐、向右延长,
 * 长度 = chunk 字符数 / 最长 chunk。
 *   - 滚动: 视口顶部的那个 chunk 对应的 bar 高亮 (merge 视图按长度占比估算)
 *   - 悬停: 气泡显示 chunk size
 *   - 点击: 平滑滚动到该 chunk
 */
const RAIL_MIN_RATIO = 0.05;   // 空/极短的 chunk 也留一根看得见的 bar
const RAIL_TOP_PAD = 34;       // 自动滚动时给 sticky 标题让出的空间
const RAIL_BOTTOM_PAD = 12;

let railSizes = [];            // 每个 chunk 的字符数
let railTotal = 0;             // 字符数总和 (merge 视图估算用)
let railRegions = [];          // split / meta: 每个 chunk 的 DOM 区块
let activeBarIndex = -1;
let railFrame = 0;

function chunkCharCount(c) {
  return (c.content || '').length;
}

function isRailVisible() {
  return Array.isArray(state.chunks) && state.chunks.length > 0 && !state.error;
}

function renderRail() {
  hideTip();

  if (!isRailVisible()) {
    chunkRail.hidden = true;
    chunkRail.innerHTML = '';
    railSizes = [];
    railRegions = [];
    activeBarIndex = -1;
    return;
  }

  railSizes = state.chunks.map(chunkCharCount);
  railTotal = railSizes.reduce((a, b) => a + b, 0);
  const max = railSizes.reduce((m, n) => Math.max(m, n), 0) || 1;

  let html = `<div class="rail-caption">chunk size</div><div class="rail-bars">`;
  railSizes.forEach((n, i) => {
    const pct = Math.max(RAIL_MIN_RATIO, n / max) * 100;
    html += `<button class="rail-bar" type="button" data-index="${i}" aria-label="Chunk ${i + 1}, ${n} chars" style="width:${pct.toFixed(2)}%"></button>`;
  });
  html += `</div>`;
  chunkRail.innerHTML = html;
  chunkRail.hidden = false;

  // merge 视图没有逐 chunk 的 DOM 区块, 此时用长度占比估算
  railRegions = Array.from(preview.querySelectorAll('[data-chunk-index]'));

  activeBarIndex = -1;
  setActiveBar(activeIndexFromScroll());
}

function railBars() {
  return chunkRail.querySelectorAll('.rail-bar');
}

function setActiveBar(index) {
  if (!railSizes.length) return;
  const clamped = Number.isFinite(index) ? index : 0;
  const next = Math.min(railSizes.length - 1, Math.max(0, clamped));
  if (next === activeBarIndex) return;

  const bars = railBars();
  const prev = bars[activeBarIndex];
  if (prev) prev.classList.remove('active');

  const bar = bars[next];
  if (bar) {
    bar.classList.add('active');
    ensureBarVisible(bar);
  }
  activeBarIndex = next;
}

// 高亮的 bar 若滚出 rail 视野, 就把它带回来
function ensureBarVisible(bar) {
  const railRect = chunkRail.getBoundingClientRect();
  const r = bar.getBoundingClientRect();
  if (r.top < railRect.top + RAIL_TOP_PAD) {
    chunkRail.scrollTop -= railRect.top + RAIL_TOP_PAD - r.top;
  } else if (r.bottom > railRect.bottom - RAIL_BOTTOM_PAD) {
    chunkRail.scrollTop += r.bottom - (railRect.bottom - RAIL_BOTTOM_PAD);
  }
}

// 当前「阅读线」(视口顶部往下一点) 落在哪个 chunk 上
function activeIndexFromScroll() {
  if (!railSizes.length) return 0;

  if (state.mode === 'merge' || !railRegions.length) {
    // 拼接后的文档长度 ≈ 各 chunk 长度之和, 按比例换算
    const line = preview.scrollTop;
    const target = (line / Math.max(1, preview.scrollHeight)) * railTotal;
    let acc = 0;
    for (let i = 0; i < railSizes.length; i += 1) {
      acc += railSizes[i];
      if (target < acc) return i;
    }
    return railSizes.length - 1;
  }

  const containerTop = preview.getBoundingClientRect().top;
  let index = Number(railRegions[0].dataset.chunkIndex) || 0;
  for (const el of railRegions) {
    if (el.getBoundingClientRect().top <= containerTop + 8) {
      index = Number(el.dataset.chunkIndex) || 0;
    } else {
      break;
    }
  }
  return index;
}

function updateActiveBar() {
  if (!railSizes.length) return;
  setActiveBar(activeIndexFromScroll());
}

function onPreviewScroll() {
  hideTip();
  if (!railSizes.length || railFrame) return;
  railFrame = requestAnimationFrame(() => {
    railFrame = 0;
    updateActiveBar();
  });
}

function scrollToChunk(index) {
  if (!railSizes.length) return;
  hideTip();

  if (state.mode === 'merge' || !railRegions.length) {
    const before = railSizes.slice(0, index).reduce((a, b) => a + b, 0);
    const top = (before / Math.max(1, railTotal)) * preview.scrollHeight - 12;
    preview.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    return;
  }

  const el = preview.querySelector(`[data-chunk-index="${index}"]`);
  if (!el) return;
  const top = el.getBoundingClientRect().top - preview.getBoundingClientRect().top + preview.scrollTop - 12;
  preview.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
}

/* ---- 悬停气泡 ---- */
function showTip(bar) {
  const index = Number(bar.dataset.index);
  const n = railSizes[index] || 0;
  railTip.textContent = `Chunk ${index + 1} · ${n.toLocaleString('zh-CN')} chars`;
  railTip.hidden = false;

  const r = bar.getBoundingClientRect();
  const tip = railTip.getBoundingClientRect();
  let left = r.right + 10;
  if (left + tip.width > window.innerWidth - 8) {
    left = Math.max(8, r.left - tip.width - 10);
  }
  const half = tip.height / 2;
  const top = Math.min(Math.max(r.top + r.height / 2, half + 6), window.innerHeight - half - 6);
  railTip.style.left = `${left}px`;
  railTip.style.top = `${top}px`;
}

function hideTip() {
  railTip.hidden = true;
}

chunkRail.addEventListener('click', (e) => {
  const bar = e.target.closest('.rail-bar');
  if (bar) scrollToChunk(Number(bar.dataset.index));
});

chunkRail.addEventListener('mouseover', (e) => {
  const bar = e.target.closest('.rail-bar');
  if (bar) showTip(bar);
});

chunkRail.addEventListener('mouseleave', hideTip);
chunkRail.addEventListener('mouseout', (e) => {
  const to = e.relatedTarget;
  if (!to || typeof to.closest !== 'function' || !to.closest('.rail-bar')) hideTip();
});
chunkRail.addEventListener('scroll', hideTip, { passive: true });
chunkRail.addEventListener('focusin', (e) => {
  const bar = e.target.closest('.rail-bar');
  if (bar) showTip(bar);
});
chunkRail.addEventListener('focusout', hideTip);

preview.addEventListener('scroll', onPreviewScroll, { passive: true });
window.addEventListener('resize', hideTip);

/* ======================= Segmented switch ======================= */
function setupSegmented(container, onChange) {
  const thumb = container.querySelector('.seg-thumb');
  const btns = Array.from(container.querySelectorAll('.seg-btn'));

  function updateThumb() {
    const active = container.querySelector('.seg-btn.active');
    if (!active || !thumb) return;
    thumb.style.width = active.offsetWidth + 'px';
    thumb.style.transform = `translateX(${active.offsetLeft}px)`;
  }

  container.addEventListener('click', (e) => {
    const btn = e.target.closest('.seg-btn');
    if (!btn || btn.classList.contains('active')) return;
    btns.forEach((b) => b.classList.toggle('active', b === btn));
    updateThumb();
    onChange(btn.dataset.value);
  });

  requestAnimationFrame(updateThumb);
  window.addEventListener('resize', updateThumb);
  return { update: updateThumb };
}

setupSegmented(modeSwitch, (value) => {
  state.mode = value;
  render();
});

/* ======================= marked (async 加载, 到了再重渲染) ======================= */
function onMarkedReady() {
  if (!window.marked || typeof window.marked.use !== 'function') return;
  marked.use({ gfm: true, breaks: true });
  render();   // 用真正的 Markdown 渲染重刷一次
}

// index.html 里 marked 是 async 的: 可能先于本文件执行完 (命中缓存), 也可能之后才到
if (window.marked) onMarkedReady();
window.__onMarkedReady = onMarkedReady;

/* ======================= 读取拖入 / 选中的文件 ======================= */
async function loadFile(file) {
  if (!file) return;
  state.file = { name: file.name, size: file.size };
  state.error = null;

  try {
    const text = await file.text();

    let data;
    try {
      data = JSON.parse(text);
    } catch (err) {
      throw new Error(`不是合法的 JSON (${err.message})`);
    }
    if (!Array.isArray(data)) {
      throw new Error('顶层结构应该是一个数组 (chunk list)');
    }

    state.chunks = data;
    state.loadedAt = new Date();
  } catch (err) {
    state.chunks = null;
    state.error = err;
  }

  render();
}

function loadFromFileList(fileList) {
  const files = Array.from(fileList || []);
  if (files.length === 0) return;
  // 优先挑 .json, 否则就用第一个
  loadFile(files.find((f) => /\.json$/i.test(f.name)) || files[0]);
}

/* ======================= Render ======================= */
function render() {
  // 顶栏信息
  srcPath.textContent = state.file ? state.file.name : '未载入';
  if (state.error) {
    srcMeta.textContent = '解析失败';
  } else if (state.chunks) {
    const parts = [`${state.chunks.length} chunks`];
    if (state.file) parts.push(formatSize(state.file.size));
    const t = clockTime(state.loadedAt);
    if (t) parts.push(t);
    srcMeta.textContent = parts.join(' · ');
  } else {
    srcMeta.textContent = '拖入 chunks.json';
  }

  document.body.classList.toggle('dragging', state.dragging);

  if (state.error) {
    renderRail();
    renderError();
    return;
  }

  if (!state.chunks) {
    renderRail();
    renderDropzone();
    return;
  }

  if (state.chunks.length === 0) {
    renderRail();
    setContent(`<div class="empty-state">这份 JSON 里没有任何 chunk。</div>`);
    return;
  }

  if (state.mode === 'meta') {
    renderMeta();
  } else if (state.mode === 'split') {
    renderSplit();
  } else {
    renderMerge();
  }

  // 正文渲染完再建左侧长度条, 这样能直接索引到每个 chunk 的 DOM 区块
  renderRail();
}

function renderSplit() {
  const chunks = state.chunks;

  let html = '';
  chunks.forEach((c, i) => {
    const title = (c.title_stack || []).join(' › ');
    const level = Number.isFinite(c.level) ? c.level : 0;

    html += `<div class="chunk-card" data-chunk-index="${i}">`;
    html += `<div class="chunk-card-head">`;
    html += `<span class="chunk-badge">Chunk ${i + 1}</span>`;
    if (title) html += `<span class="chunk-title-stack" title="${escapeHtml(title)}">${escapeHtml(title)}</span>`;
    html += `<span class="chunk-level">${level > 0 ? 'H' + level : 'top'}</span>`;
    html += `<span class="chunk-size-note">${(c.content || '').length} chars</span>`;
    html += `</div>`;
    html += `<div class="chunk-card-body markdown-body">${renderMarkdown(c.content || '')}</div>`;
    html += `</div>`;
    if (i < chunks.length - 1) {
      html += `<div class="split-marker"><span class="scissors">✂</span> split ${i + 1} → ${i + 2}</div>`;
    }
  });

  setContent(html);
}

// 只用 JSON 里的信息把原始文档拼回去: 标题取 title_stack 的最后一项
function buildDocument(chunks) {
  const parts = [];
  chunks.forEach((c) => {
    const level = Number.isFinite(c.level) ? c.level : 0;
    const stack = c.title_stack || [];
    const heading = stack.length ? stack[stack.length - 1] : '';
    if (level > 0 && heading) parts.push('#'.repeat(Math.min(level, 6)) + ' ' + heading);
    if (c.content) parts.push(c.content);
  });
  return parts.join('\n\n');
}

function renderMerge() {
  const md = buildDocument(state.chunks);
  setContent(`<div class="chunk-card"><div class="chunk-card-body markdown-body">${renderMarkdown(md)}</div></div>`);
}

// 复制文本并给按钮一个短暂的反馈; 没有 clipboard 权限时退化成 execCommand
async function copyText(text, btn, idleHtml, doneHtml, failHtml) {
  let ok = true;
  try {
    if (navigator.clipboard && window.isSecureContext !== false) {
      await navigator.clipboard.writeText(text);
    } else {
      ok = legacyCopy(text);
    }
  } catch {
    ok = legacyCopy(text);
  }
  btn.innerHTML = ok ? doneHtml : failHtml;
  setTimeout(() => {
    btn.innerHTML = idleHtml;
  }, 1400);
}

function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '-1000px';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try {
    ok = document.execCommand('copy');
  } catch {
    ok = false;
  }
  document.body.removeChild(ta);
  return ok;
}

function renderMeta() {
  const json = JSON.stringify(state.chunks, null, 2);
  const label = state.file ? state.file.name : 'chunks.json';

  let html = '';
  html += `<div class="meta-bar">`;
  html += `<span class="meta-count">${state.chunks.length} chunks · ${escapeHtml(label)}</span>`;
  html += `<button id="copyJsonBtn" class="btn primary" type="button"><span class="btn-icon">⧉</span> Copy JSON</button>`;
  html += `</div>`;

  // 每个 chunk 一个代码卡片: 超出显示宽度时换行 (见 .meta-json 的 pre-wrap)
  state.chunks.forEach((c, i) => {
    const title = (c.title_stack || []).join(' › ');
    const itemJson = JSON.stringify(c, null, 2);
    const chars = (c.content || '').length;
    const bytes = byteLength(itemJson);
    html += `<div class="meta-card" data-chunk-index="${i}">`;
    html += `<div class="meta-card-head">`;
    html += `<span class="chunk-badge">Chunk ${i + 1}</span>`;
    if (title) html += `<span class="chunk-title-stack" title="${escapeHtml(title)}">${escapeHtml(title)}</span>`;
    html += `<span class="chunk-size-note" title="content ${chars} chars · JSON ${formatSize(bytes)}">${chars} chars · ${formatSize(bytes)}</span>`;
    html += `<button class="meta-copy" type="button" data-index="${i}" title="复制这个元素"><span class="btn-icon">⧉</span></button>`;
    html += `</div>`;
    html += `<pre class="meta-json">${escapeHtml(itemJson)}</pre>`;
    html += `</div>`;
  });

  setContent(html);

  const copyAllBtn = $('#copyJsonBtn');
  if (copyAllBtn) {
    const idle = '<span class="btn-icon">⧉</span> Copy JSON';
    copyAllBtn.addEventListener('click', () =>
      copyText(json, copyAllBtn, idle, '<span class="btn-icon">✓</span> Copied', '<span class="btn-icon">✗</span> Copy failed'));
  }

  preview.querySelectorAll('.meta-copy').forEach((btn) => {
    const idle = '<span class="btn-icon">⧉</span>';
    btn.addEventListener('click', () => {
      const item = state.chunks[Number(btn.dataset.index)];
      copyText(JSON.stringify(item, null, 2), btn, idle, '<span class="btn-icon">✓</span>', '<span class="btn-icon">✗</span>');
    });
  });
}

function renderDropzone() {
  setContent(`
    <button type="button" class="dropzone">
      <span class="dropzone-icon">⤓</span>
      <span class="dropzone-title">把 chunks.json 拖到这里</span>
      <span class="dropzone-sub">或点右上角「打开 JSON」选择文件</span>
      <span class="dropzone-hint">
        文件由 <code>PYTHONPATH=backend python -m common.utils.markdown_splitter</code> 生成到 <code>var/tmp/chunks.json</code>
      </span>
    </button>`);
}

function renderError() {
  const name = state.file ? state.file.name : '文件';

  setContent(`
    <div class="empty-state">
      <strong>读取 <code>${escapeHtml(name)}</code> 失败:</strong>
      ${escapeHtml(state.error.message || state.error)}<br /><br />
      期望的格式是一个 chunk 数组:<br />
      <code>[{"content": "…", "level": 2, "title_stack": ["第一章", "习题"]}, …]</code><br /><br />
      可以用 <code>PYTHONPATH=backend python -m common.utils.markdown_splitter</code> 生成,
      然后重新把文件拖进来。
    </div>`);
}

/* ======================= Events ======================= */
// 显示宽度: 拖动滑杆实时生效, 点百分比重置为默认值
widthRange.addEventListener('input', () => applyWidth(widthRange.value));
widthRange.addEventListener('change', () => applyWidth(widthRange.value));
widthValue.addEventListener('click', () => applyWidth(WIDTH_DEFAULT));

// 选择文件
openBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  loadFromFileList(fileInput.files);
  fileInput.value = '';   // 允许重复选择同一个文件
});

// 点击空白区的拖拽提示也能选文件
preview.addEventListener('click', (e) => {
  if (e.target.closest('.dropzone')) fileInput.click();
});

// 拖拽: 整窗口都是投放区
let dragDepth = 0;

function setDragging(on) {
  if (state.dragging === on) return;
  state.dragging = on;
  document.body.classList.toggle('dragging', on);
}

window.addEventListener('dragenter', (e) => {
  e.preventDefault();
  dragDepth += 1;
  setDragging(true);
});

window.addEventListener('dragover', (e) => {
  e.preventDefault();               // 必须阻止默认行为, 否则浏览器会直接打开文件
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
  setDragging(true);
});

window.addEventListener('dragleave', (e) => {
  e.preventDefault();
  dragDepth = Math.max(0, dragDepth - 1);
  // relatedTarget 为 null 表示真正离开了窗口
  if (dragDepth === 0 || e.relatedTarget === null) {
    dragDepth = 0;
    setDragging(false);
  }
});

window.addEventListener('drop', (e) => {
  e.preventDefault();
  dragDepth = 0;
  setDragging(false);
  if (e.dataTransfer && e.dataTransfer.files) {
    loadFromFileList(e.dataTransfer.files);
  }
});

/* ======================= Init ======================= */
applyWidth(initialWidth(), { persist: false });   // 默认 50% 窗口宽度
render();
    </script>
  </body>
</html>
