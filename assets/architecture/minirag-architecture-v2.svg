<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
<defs>
  <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="2.5" orient="auto"><path d="M0,0 L0,5 L6,2.5 z" fill="var(--arrow)"/></marker>
  <marker id="arrowBlue" markerWidth="6" markerHeight="6" refX="5" refY="2.5" orient="auto"><path d="M0,0 L0,5 L6,2.5 z" fill="var(--main-arrow)"/></marker>
  <style>
  :root {
    color-scheme: light dark;
    --bg:#f8fafc; --surface:#ffffff; --text:#172033;
    --text-secondary:#475569; --muted:#64748b; --muted-strong:#526176;
    --neutral-border:#cbd5e1; --backend-bg:#f1f5f9; --backend-border:#94a3b8;
    --frontend-bg:#eff6ff; --frontend-border:#93c5fd; --frontend-soft-border:#bfdbfe; --frontend-text:#1d4ed8;
    --badge-bg:#e0e7ff; --badge-text:#3730a3;
    --api-border:#60a5fa; --api-bg:#dbeafe;
    --service-border:#34d399; --service-bg:#d1fae5; --service-text:#047857;
    --graph-border:#a78bfa; --graph-bg:#ede9fe; --graph-text:#6d28d9;
    --graph-panel-1:#faf5ff; --graph-panel-2:#f5f3ff; --graph-soft-border:#c4b5fd;
    --common-border:#f59e0b; --common-bg:#fef3c7; --common-text:#b45309;
    --common-panel:#fffbeb; --common-soft-border:#fcd34d;
    --infra-bg:#ecfeff; --infra-border:#67e8f9; --infra-soft-border:#a5f3fc; --infra-text:#0e7490;
    --entry-bg:#fff7ed; --entry-border:#fdba74; --entry-text:#c2410c;
    --arrow:#64748b; --main-arrow:#2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0b1220; --surface:#151f30; --text:#e5edf8;
      --text-secondary:#cbd5e1; --muted:#9aa9bd; --muted-strong:#b7c4d6;
      --neutral-border:#40516a; --backend-bg:#101a2a; --backend-border:#52647d;
      --frontend-bg:#12243b; --frontend-border:#315f91; --frontend-soft-border:#29496e; --frontend-text:#93c5fd;
      --badge-bg:#252b52; --badge-text:#c7d2fe;
      --api-border:#4b83c1; --api-bg:#1c3552;
      --service-border:#368d78; --service-bg:#153b35; --service-text:#6ee7b7;
      --graph-border:#8064ba; --graph-bg:#30254c; --graph-text:#c4b5fd;
      --graph-panel-1:#211a35; --graph-panel-2:#292044; --graph-soft-border:#5d4789;
      --common-border:#b7791f; --common-bg:#493719; --common-text:#fcd34d;
      --common-panel:#302713; --common-soft-border:#80602a;
      --infra-bg:#102c36; --infra-border:#267184; --infra-soft-border:#285b68; --infra-text:#67e8f9;
      --entry-bg:#3b251b; --entry-border:#995b35; --entry-text:#fdba74;
      --arrow:#91a1b7; --main-arrow:#60a5fa;
    }
  }

    text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}
    .title{font-size:30px;font-weight:700;fill:var(--text)}.subtitle{font-size:14px;fill:var(--muted)}
    .layer{font-size:17px;font-weight:700}.name{font-size:16px;font-weight:700}
    .desc{font-size:12px;fill:var(--muted-strong)}.small{font-size:12px;fill:var(--text-secondary)}
    .tiny{font-size:11px;fill:var(--muted)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
    .panel{stroke-width:1.5}.node{stroke-width:1.2}
    .flow{fill:none;stroke:var(--arrow);stroke-width:2.4;marker-end:url(#arrow)}
    .mainflow{fill:none;stroke:var(--main-arrow);stroke-width:3;marker-end:url(#arrowBlue)}
    .dash{stroke-dasharray:6 5}
  
  /* Final contrast safeguard: override hard-coded SVG text fills in dark mode. */
  @media (prefers-color-scheme: dark) {
    text, text tspan {
      fill: var(--text) !important;
    }
    .subtitle, .desc, .small, .tiny {
      fill: var(--muted-strong) !important;
    }
    text[fill="#172033"], text[fill="#475569"], text[fill="#526176"],
    text[fill="#64748b"], text[fill="#000"], text[fill="#000000"],
    text[fill="black"] {
      fill: var(--text) !important;
    }
  }

</style>
</defs>
<rect width="1600" height="1180" fill="var(--bg)"/>
<text x="64" y="55" class="title">MiniRAG · 系统架构</text>
<text x="64" y="82" class="subtitle">分层职责、核心调用链与工程支撑结构</text>
<rect x="1320" y="34" width="216" height="38" rx="19" fill="var(--badge-bg)"/>
<text x="1428" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="var(--badge-text)">主调用方向</text>

<!-- Frontend -->
<rect x="64" y="112" width="1472" height="104" rx="14" fill="var(--frontend-bg)" stroke="var(--frontend-border)" class="panel"/>
<text x="88" y="142" class="layer" fill="var(--frontend-text)">前端层</text>
<rect x="250" y="128" width="1248" height="68" rx="10" fill="var(--surface)" stroke="var(--frontend-soft-border)" class="node"/>
<text x="276" y="157" class="name">frontend/ · React 19 + Vite 6</text>
<text x="276" y="180" class="desc">src/ · pages  /  components  /  store  /  lib  /  hooks  /  types  /  styles</text>

<!-- backend boundary -->
<rect x="64" y="242" width="1472" height="642" rx="16" fill="var(--backend-bg)" stroke="var(--backend-border)" stroke-width="1.6"/>
<text x="88" y="273" class="layer">backend/ · Python 源码根（sys.path 根）</text>
<text x="1505" y="273" text-anchor="end" class="tiny">后端核心调用链</text>

<!-- API -->
<rect x="100" y="302" width="1400" height="86" rx="11" fill="var(--surface)" stroke="var(--api-border)" class="node"/>
<rect x="100" y="302" width="154" height="86" rx="11" fill="var(--api-bg)"/>
<text x="177" y="339" text-anchor="middle" class="name" fill="var(--frontend-text)">api/</text>
<text x="177" y="362" text-anchor="middle" class="tiny">HTTP 层</text>
<text x="284" y="337" class="name">路由 · DTO · SSE 传输 · 启动自检</text>
<text x="284" y="361" class="desc">接收请求、定义接口契约，并通过 SSE 向客户端传递事件</text>

<!-- service -->
<rect x="100" y="416" width="1400" height="86" rx="11" fill="var(--surface)" stroke="var(--service-border)" class="node"/>
<rect x="100" y="416" width="154" height="86" rx="11" fill="var(--service-bg)"/>
<text x="177" y="453" text-anchor="middle" class="name" fill="var(--service-text)">service/</text>
<text x="177" y="476" text-anchor="middle" class="tiny">业务编排</text>
<text x="284" y="451" class="name">docs  ·  import  ·  query</text>
<text x="284" y="475" class="desc">组织文档管理、导入与查询等应用级业务流程</text>

<!-- graphs -->
<rect x="100" y="530" width="1400" height="166" rx="11" fill="var(--surface)" stroke="var(--graph-border)" class="node"/>
<rect x="100" y="530" width="154" height="166" rx="11" fill="var(--graph-bg)"/>
<text x="177" y="598" text-anchor="middle" class="name" fill="var(--graph-text)">graphs/</text>
<text x="177" y="621" text-anchor="middle" class="tiny">LangGraph 图</text>
<rect x="284" y="548" width="574" height="130" rx="9" fill="var(--graph-panel-1)" stroke="var(--graph-soft-border)"/>
<text x="306" y="575" class="name" fill="var(--graph-text)">import_graph/ · 导入图</text>
<text x="306" y="600" class="desc">解析</text><text x="342" y="600" class="desc">→</text>
<text x="370" y="600" class="desc">图片处理</text><text x="442" y="600" class="desc">→</text>
<text x="470" y="600" class="desc">切分</text><text x="514" y="600" class="desc">→</text>
<text x="542" y="600" class="desc">入库</text>
<text x="306" y="646" class="tiny">文档内容解析、图像处理、文本分块与持久化</text>
<rect x="882" y="548" width="594" height="130" rx="9" fill="var(--graph-panel-2)" stroke="var(--graph-soft-border)"/>
<text x="904" y="575" class="name" fill="var(--graph-text)">query_graph/ · 查询图</text>
<text x="904" y="600" class="desc">改写</text><text x="946" y="600" class="desc">→</text>
<text x="974" y="600" class="desc">多路召回</text><text x="1050" y="600" class="desc">→</text>
<text x="1078" y="600" class="desc">融合精排</text><text x="1154" y="600" class="desc">→</text>
<text x="1182" y="600" class="desc">生成</text>
<text x="904" y="646" class="tiny">查询理解、并行检索、结果融合排序与答案生成</text>

<!-- common -->
<rect x="100" y="724" width="1400" height="136" rx="11" fill="var(--surface)" stroke="var(--common-border)" class="node"/>
<rect x="100" y="724" width="154" height="136" rx="11" fill="var(--common-bg)"/>
<text x="177" y="783" text-anchor="middle" class="name" fill="var(--common-text)">common/</text>
<text x="177" y="806" text-anchor="middle" class="tiny">唯一共享层</text>
<g>
<rect x="278" y="742" width="286" height="48" rx="7" fill="var(--common-panel)" stroke="var(--common-soft-border)"/>
<text x="294" y="762" class="name" font-size="14">config/</text><text x="294" y="779" class="tiny">运行参数 / 环境变量 / 路径</text>
<rect x="578" y="742" width="286" height="48" rx="7" fill="var(--common-panel)" stroke="var(--common-soft-border)"/>
<text x="594" y="762" class="name" font-size="14">model/</text><text x="594" y="779" class="tiny">LLM / VLM / Embedding / Reranker</text>
<rect x="878" y="742" width="286" height="48" rx="7" fill="var(--common-panel)" stroke="var(--common-soft-border)"/>
<text x="894" y="762" class="name" font-size="14">client/</text><text x="894" y="779" class="tiny">Milvus / MinIO / MongoDB / MinerU / WebSearch</text>
<rect x="1178" y="742" width="286" height="48" rx="7" fill="var(--common-panel)" stroke="var(--common-soft-border)"/>
<text x="1194" y="762" class="name" font-size="14">events/</text><text x="1194" y="779" class="tiny">SSE 总线 / 任务表 / Token 计量</text>
<rect x="278" y="800" width="286" height="44" rx="7" fill="var(--common-panel)" stroke="var(--common-soft-border)"/>
<text x="294" y="827" class="name" font-size="14">store/</text><text x="365" y="827" class="tiny">会话历史 / 文档仓储 / 用量存储</text>
<rect x="578" y="800" width="286" height="44" rx="7" fill="var(--common-panel)" stroke="var(--common-soft-border)"/>
<text x="594" y="827" class="name" font-size="14">prompt/</text><text x="670" y="827" class="tiny">Prompt 模板</text>
<rect x="878" y="800" width="286" height="44" rx="7" fill="var(--common-panel)" stroke="var(--common-soft-border)"/>
<text x="894" y="827" class="name" font-size="14">schema/</text><text x="970" y="827" class="tiny">全局数据结构</text>
<rect x="1178" y="800" width="286" height="44" rx="7" fill="var(--common-panel)" stroke="var(--common-soft-border)"/>
<text x="1194" y="827" class="name" font-size="14">utils/</text><text x="1260" y="827" class="tiny">切分 / 图片 / Token 工具</text>
</g>

<!-- main arrows -->
<path d="M800 216 V298" class="mainflow"/>
<path d="M800 388 V412" class="mainflow"/>
<path d="M800 502 V526" class="mainflow"/>
<path d="M800 696 V720" class="mainflow"/>
<text x="818" y="235" class="tiny" fill="var(--main-arrow)">HTTP / SSE</text>

<!-- external services -->
<rect x="64" y="910" width="1472" height="112" rx="14" fill="var(--infra-bg)" stroke="var(--infra-border)" class="panel"/>
<text x="88" y="940" class="layer" fill="var(--infra-text)">外部服务与基础设施</text>
<g fill="var(--surface)" stroke="var(--infra-soft-border)">
<rect x="88" y="956" width="250" height="48" rx="8"/><rect x="356" y="956" width="250" height="48" rx="8"/>
<rect x="624" y="956" width="250" height="48" rx="8"/><rect x="892" y="956" width="250" height="48" rx="8"/>
<rect x="1160" y="956" width="350" height="48" rx="8"/>
</g>
<g text-anchor="middle" class="small">
<text x="213" y="985">模型服务 · LLM / VLM / Embedding</text>
<text x="481" y="985">向量数据库 · Milvus</text>
